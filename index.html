<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Northgate High</title>
<style>
:root{
  --paper:#FFFAF5; --ink:#2D2424; --sub:#8A8178; --line:#E8E0D6;
  --card:#FFFFFF; --accent:#C0392B;
  --sports:#C0392B; --social:#E67E22; --acad:#2E86C1;
  --art:#8E44AD; --south:#27AE60; --under:#566573;
  --sel-bg:#EBD5D5; --sel-fg:#5B2E35;
  /* 字体栈：零外链，全部走系统内置。Cinzel 有则用、无则自动回退衬线 */
  --font-display:"Cinzel","Songti SC","STSong","Source Han Serif SC",
                 "Noto Serif CJK SC","Noto Serif SC",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",
              "Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",
              "Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
::selection{background:var(--sel-bg);color:var(--sel-fg);}
::-moz-selection{background:var(--sel-bg);color:var(--sel-fg);}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:15px;line-height:1.6;padding-bottom:64px;}
.page{max-width:520px;margin:0 auto;padding:12px;}

/* ===== 顶栏 ===== */
#topbar{position:sticky;top:0;z-index:50;background:rgba(255,250,245,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;align-items:center;gap:8px;}
#topbar .t-time{font-size:12px;color:var(--sub);font-weight:600;}
#topbar .t-stats{display:flex;gap:6px;flex:1;overflow-x:auto;font-size:11px;}
#topbar .t-stats::-webkit-scrollbar{display:none}
.chip{padding:2px 7px;border-radius:20px;background:#F2ECE4;
  white-space:nowrap;font-weight:600;color:#5A5048;}
.chip b{color:var(--accent);font-weight:700;}

/* ===== 卡片/气泡 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:10px 0;}
.narr{font-size:15px;line-height:1.75;white-space:pre-wrap;}
.bubble{margin:8px 0;display:flex;gap:8px;align-items:flex-start;}
.bubble .av{width:34px;height:34px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px;}
.bubble .bb{flex:1;}
.bubble .bn{font-size:12px;font-weight:700;margin-bottom:3px;}
.bubble .bt{background:#fff;border:1px solid var(--line);
  border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14px;}
.c-sports .av{background:var(--sports)} .c-sports .bn{color:var(--sports)} .c-sports .bt{border-color:#F2C7C2}
.c-social .av{background:var(--social)} .c-social .bn{color:var(--social)} .c-social .bt{border-color:#F6D5B0}
.c-acad .av{background:var(--acad)} .c-acad .bn{color:var(--acad)} .c-acad .bt{border-color:#BFD9EE}
.c-art .av{background:var(--art)} .c-art .bn{color:var(--art)} .c-art .bt{border-color:#DCC2EC}
.c-south .av{background:var(--south)} .c-south .bn{color:var(--south)} .c-south .bt{border-color:#BEE6CC}
.c-under .av{background:var(--under)} .c-under .bn{color:var(--under)} .c-under .bt{border-color:#CBD3D9}
/* ===== 主页线性流：我方行动 ===== */
.mine{display:block;margin:6px 0 6px auto;max-width:86%;
  background:linear-gradient(135deg,#FFF4EC,#FFE9DC);
  border:1px solid #F6DDCB;border-radius:14px 14px 4px 14px;
  padding:9px 13px;font-size:14px;line-height:1.6;color:#6B4A38;
  box-shadow:0 1px 4px rgba(200,120,70,.08);}
/* ===== 主页线性流：NPC 气泡（保留圈子色，去重量边框） ===== */
.bub{margin:9px 0;max-width:88%;}
.bub-h{margin-bottom:3px;}
.bub-n{font-size:11.5px;font-weight:700;letter-spacing:.3px;}
.bub-t{background:#fff;border:1px solid var(--line);
  border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14px;line-height:1.6;}
.bub.c-sports .bub-n{color:var(--sports)} .bub.c-sports .bub-t{border-color:#F2C7C2;border-left:3px solid var(--sports)}
.bub.c-social .bub-n{color:var(--social)} .bub.c-social .bub-t{border-color:#F6D5B0;border-left:3px solid var(--social)}
.bub.c-acad   .bub-n{color:var(--acad)}   .bub.c-acad   .bub-t{border-color:#BFD9EE;border-left:3px solid var(--acad)}
.bub.c-art    .bub-n{color:var(--art)}    .bub.c-art    .bub-t{border-color:#DCC2EC;border-left:3px solid var(--art)}
.bub.c-south  .bub-n{color:var(--south)}  .bub.c-south  .bub-t{border-color:#BEE6CC;border-left:3px solid var(--south)}
.bub.c-under  .bub-n{color:var(--under)}  .bub.c-under  .bub-t{border-color:#CBD3D9;border-left:3px solid var(--under)}

/* ===== 选项卡 ===== */
.btn-main{display:block;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:9px 13px;margin:6px 0;font-size:14px;
  color:var(--ink);cursor:pointer;transition:.15s;}
.btn-main:active{background:#FFF3EE;transform:scale(.99)}
.btn-main .risk{font-size:11px;color:var(--sub);margin-top:2px;}

/* ===== 输入框 ===== */
#inputbar{display:flex;gap:8px;margin:10px 0;}
#inputbar input{flex:1;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:15px;background:#fff;outline:none;}
#inputbar input:focus{border-color:var(--accent)}
#inputbar button{border:none;background:var(--accent);color:#fff;
  border-radius:10px;padding:0 18px;font-size:15px;font-weight:700;cursor:pointer;}

/* ===== 论坛（NGA风格） ===== */
.fpost{border-bottom:1px solid var(--line);padding:12px 2px;}
.fpost .fh{font-size:11px;color:var(--sub);margin-bottom:5px;}
.fpost .ft{font-size:14.5px;font-weight:700;line-height:1.5;}
.floors{margin-top:7px;font-size:13px;}
.floors .fl{display:flex;justify-content:space-between;gap:8px;
  padding:3px 0;color:#4A423B;}
.floors .fl .lk{color:#B0A79D;font-size:11px;white-space:nowrap;}
.ftag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
  background:#FCE9E7;color:#C0392B;font-weight:700;margin-left:6px;}
.ftag.hot{background:#FDEBD3;color:#E67E22}

/* ===== IG ===== */
.igpost{background:#fff;border:1px solid var(--line);border-radius:14px;
  margin:11px 0;overflow:hidden;}
.ighead{display:flex;align-items:center;gap:9px;padding:11px 13px;}
.igav{width:34px;height:34px;border-radius:50%;}
.ighead .igid{font-weight:700;font-size:14px;}
.igcap{padding:4px 13px 10px;font-size:14px;line-height:1.6;}
.igacts{display:flex;gap:16px;padding:9px 13px;border-top:1px solid var(--line);
  font-size:13px;color:var(--sub);}
.igacts span{cursor:pointer;}
.igacts .on{color:var(--accent);font-weight:700;}

/* ===== 底部导航 ===== */
#nav{position:fixed;bottom:0;left:0;right:0;height:58px;box-sizing:content-box;background:rgba(255,250,245,.98);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;z-index:99;}
#nav .nv{flex:1;text-align:center;padding:9px 0;font-size:11px;
  color:var(--sub);cursor:pointer;}
#nav .nv.on{color:var(--accent);font-weight:700;}
#nav .nv .ic{font-size:19px;display:block;}

/* ===== 通用 ===== */
.h1{font-size:20px;font-weight:800;margin:6px 0 12px;
  font-family:var(--font-display);letter-spacing:.03em;color:#3D3530;}
.h2{font-size:15px;font-weight:800;margin:14px 0 8px;color:#5A5048;
  font-family:var(--font-display);letter-spacing:.04em;}
.muted{color:var(--sub);font-size:12.5px;}
.bar-row{display:flex;align-items:center;gap:9px;margin:7px 0;}
.bar-row .lb{width:44px;font-size:12.5px;color:var(--sub);}
.bar-bg{flex:1;height:9px;background:#EFE8DF;border-radius:6px;overflow:hidden;}
.bar-fg{height:100%;border-radius:6px;background:var(--accent);transition:.4s;}
.bar-row .vl{width:26px;text-align:right;font-size:12.5px;font-weight:700;}
.list-item{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--line);}
.list-item .lav{width:40px;height:40px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}
.list-item .ln{font-weight:700;font-size:14.5px;}
.list-item .lr{font-size:12px;color:var(--sub);}
.hide{display:none!important;}
.loading{text-align:center;padding:26px;color:var(--sub);}
.spin{display:inline-block;width:22px;height:22px;border:3px solid #EFE8DF;
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
input,textarea,select{font-family:inherit}
.set-in{width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;background:#fff;outline:none;margin:5px 0;}
.set-in:focus{border-color:var(--accent)}
.mini{font-size:12px;padding:7px 13px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;cursor:pointer;font-weight:600;color:#5A5048;}
.mini.pri{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ===== 块5 视图层样式补丁 ===== */
/* 论坛侧「片场之外」卡片 */
.fo-hook{margin:10px 0;padding:10px 12px;border-radius:11px;background:#FFFCF2;
  border:1px solid #F0E2C4;border-left:3px solid #C9A227;}
.fo-hook .fo-hk-h{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
.fo-hook .fo-hk-t{font-size:12px;font-weight:800;color:#9A7B15;letter-spacing:.5px;}
.fo-hook .fo-hk-s{font-size:11px;}
.fo-hook .fo-hk-b{font-size:13.5px;line-height:1.65;color:#6B5A2E;}
/* 主页置顶：地点 · 时间 · 天气 */
.status-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0;
  padding:7px 11px;border-radius:10px;font-size:12.5px;line-height:1.4;
  background:#F4F1EA;border:1px solid #E7E0D3;color:#6B6157;}
.status-bar:empty{display:none}
.status-bar .sb-i{white-space:nowrap;}
.status-bar .sb-sep{color:#CFC6B8;}
.status-bar b{color:#4A423C;font-weight:700;}
body.home-mode #statusBar{flex:none;}


/* 场景流容器 */
.scene-wrap{display:flex;flex-direction:column;gap:12px;padding:12px 0 4px;}
.flow{display:flex;flex-direction:column;gap:14px;}
.flow:empty::before{content:'开学第一天，一切都还没开始。';display:block;text-align:center;
  color:#A99C90;font-size:14px;padding:40px 0;}

/* 玩家自己的发言 */
.turn{margin:6px 0 0;display:flex;flex-direction:column;gap:6px;}
.turn .narr{background:#FFF;border-left:3px solid var(--accent);}
/* —— 主剧情：分段叙事框（视觉分层，避免“一大坨”） —— */
.narr-box{display:flex;flex-direction:column;gap:8px;margin:2px 0;}
/* ---------- 好感度变化 chip ---------- */
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px;padding:0 2px;}
.dchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:999px;background:#F2EDE6;border:1px solid #E2D8CC;color:#6B6156;}
.dchip.up{color:#1E7A46;background:#E9F6EE;border-color:#BFE4CD;}
.dchip.down{color:#B23A32;background:#FBEDEC;border-color:#EFC7C3;}
.dchip.fav{font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.dchip.fav .dchip-heart{font-size:11px;line-height:1;}
.dchip.fav .dchip-lab{font-size:10px;opacity:.72;letter-spacing:.4px;}
.dchip.fav .dchip-val{font-size:13px;font-weight:800;}
.dchip.c-sports{background:#FBE9E7;border-color:#E8A79E;color:#C0392B;}
.dchip.c-social{background:#FDF0E2;border-color:#F0C08A;color:#E67E22;}
.dchip.c-acad  {background:#E8F1FB;border-color:#A9C7E8;color:#2E86C1;}
.dchip.c-art   {background:#F3E9FA;border-color:#C9A7E4;color:#8E44AD;}
.dchip.c-south{background:#E8F7EC;border-color:#A6D8B4;color:#27AE60;}
.dchip.c-under {background:#ECEEF0;border-color:#B4BCC4;color:#566573;}
.narr-seg{position:relative;background:transparent;border:0;
  border-left:3px solid var(--line);border-radius:11px;padding:9px 12px 10px;}
.narr-seg .narr-body{font-size:14.5px;line-height:1.7;}
.narr-seg.narr-scene{border-left:2px solid #B8AFA4;background:transparent;}
.narr-seg.narr-move{border-left:2px solid #2E86C1;background:transparent;}
.narr-seg.narr-voice{border-left:2px solid #E67E22;background:transparent;}
.narr-seg.narr-beat{border-left:2px solid #8E44AD;background:transparent;}
/* ---- 玩法说明 / 色卡图例 ---- */
.hlp-sec{margin:0 0 14px;}
.hlp-t{font-size:12px;font-weight:800;letter-spacing:1px;color:#8A7C6E;margin:2px 0 8px;padding-left:9px;border-left:3px solid var(--accent);}
.hlp-item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:0 0 9px;}
.hlp-item .hi-t{font-size:13.5px;font-weight:700;color:#3D3530;margin:0 0 4px;display:flex;align-items:center;gap:6px;}
.hlp-item .hi-b{font-size:13px;line-height:1.65;color:#6B6055;}
.hlp-item .hi-b b{color:#3D3530;}
.legend-grid{display:flex;flex-direction:column;gap:7px;}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13px;}
.legend-dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;}
.legend-nm{font-weight:700;color:#3D3530;min-width:64px;}
.legend-dc{color:#8A7C6E;font-size:12.5px;}
.legend-modal{position:fixed;left:0;right:0;top:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(43,38,34,.42);}
.legend-card{width:100%;max-width:390px;max-height:82vh;overflow-y:auto;background:#FFFAF5;border-radius:18px;padding:20px 18px 16px;box-shadow:0 18px 48px rgba(43,38,34,.28);}
.legend-card h2{font-size:17px;font-weight:800;color:#3D3530;margin:0 0 4px;
  font-family:var(--font-display);letter-spacing:.04em;}
.legend-card .lc-sub{font-size:12.5px;color:#8A7C6E;margin:0 0 14px;line-height:1.55;}
.legend-go{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;}
.turn .narr-box .npc-wrap{margin-top:2px;}

/* 选项区 */
.choices{display:flex;flex-direction:column;gap:9px;margin-top:4px;}
.opt-t{font-size:14px;font-weight:600;color:#3D3530;line-height:1.5;}
.opt-h{font-size:12px;color:#9A8E84;margin-top:3px;}
.dim{opacity:.55;}

/* 自由输入区 */
.free-row{display:flex;gap:8px;margin-top:10px;align-items:stretch;}
.free-in{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;background:#fff;outline:none;}
.free-in:focus{border-color:var(--accent)}
.free-go{flex:0 0 auto;padding:0 18px;border-radius:10px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;}
.free-go:disabled{opacity:.5;cursor:default}
/* —— 主页「对话模式」 —— */
.talk-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.talk-tip{font-size:13px;font-weight:700;color:#8E44AD;}
.talk-exit{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;color:#666;cursor:pointer;font-weight:700;}
.talk-exit:hover{border-color:#C0392B;color:#C0392B;}
.free-in.talk-in{border-color:#8E44AD;}
.free-in.talk-in:focus{border-color:#8E44AD;}
/* —— 剧情流里的 NPC 对话气泡 —— */
.npc-line{margin-top:4px;padding:9px 12px;border-radius:12px;background:#fff;border-left:4px solid var(--line);font-size:14px;line-height:1.6;}
.npc-line b{display:block;font-size:12.5px;margin-bottom:2px;}
.npc-line.c-sport{border-left-color:#C0392B;} .npc-line.c-sport b{color:#C0392B;}
.npc-line.c-social{border-left-color:#E67E22;} .npc-line.c-social b{color:#E67E22;}
.npc-line.c-academic{border-left-color:#2E86C1;} .npc-line.c-academic b{color:#2E86C1;}
.npc-line.c-art{border-left-color:#8E44AD;} .npc-line.c-art b{color:#8E44AD;}
.npc-line.c-south{border-left-color:#27AE60;} .npc-line.c-south b{color:#27AE60;}
.npc-line.c-under{border-left-color:#566573;} .npc-line.c-under b{color:#566573;}
.npc-wait .npc-line{opacity:.7;}
.dots i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;opacity:.4;animation:dt 1.2s infinite;}
.dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
@keyframes dt{0%,60%,100%{opacity:.25;}30%{opacity:.9;}}
.narr.dim{font-size:13px;color:#999;padding:4px 0;}
/* —— 人物详情页搭话按钮 —— */
.pd-acts{display:flex;gap:10px;margin-top:14px;}
.pd-act-btn{flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;background:#8E44AD;color:#fff;font-weight:700;font-size:14px;}
.pd-act-btn:hover{opacity:.9;}


/* 通用视图卡（状态/认识的人/存档） */
.view{display:flex;flex-direction:column;gap:12px;padding:14px 0;}
.view-h{font-size:17px;font-weight:800;color:#3D3530;display:flex;align-items:center;gap:8px;}
.view-body{display:flex;flex-direction:column;gap:10px;}
.view-t{font-size:14px;font-weight:700;color:#5A5048;margin-top:4px;}

/* 分段选择器（性别/出身） */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.seg-b{flex:1 1 auto;min-width:96px;padding:11px 10px;border-radius:10px;cursor:pointer;text-align:center;
  border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:#5A5048;}
.seg-b.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* 出身卡列表 */
.bg-list{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
.bg-item{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;transition:.15s;}
.bg-item:hover{border-color:var(--accent);transform:translateY(-1px);}
.bg-t{font-size:14px;font-weight:700;color:#3D3530;}
.bg-d{font-size:12.5px;color:#8A7E74;line-height:1.55;margin-top:4px;}

/* 设置页 */
.set-lab{display:block;font-size:13px;font-weight:700;color:#5A5048;margin-top:10px;}
.set-tip{font-size:12px;color:#9A8E84;line-height:1.6;margin:8px 0;}
.ts{display:inline-block;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;}
.ts.ok{background:#E7F6EC;color:#1E8449;border:1px solid #B7E4C7;}
.ts.bad{background:#FDECEA;color:#C0392B;border:1px solid #F5B7B1;}

/* 存档页动作区 */
.save-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px;}

/* 底部导航 */
#nav{display:flex;position:sticky;bottom:0;background:#FFFAF5;border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;}
.nav-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;
  padding:6px 2px;cursor:pointer;border-radius:10px;}
.nav-b.on{background:#FFF1E3;}
.nav-i{font-size:19px;line-height:1;}
.nav-t{font-size:11px;color:#8A7E74;font-weight:600;}
.nav-b.on .nav-t{color:var(--accent);}

/* ===== 手机：真机外观 ===== */
.phone-shell{
  display:flex;flex-direction:column;
  max-width:340px;margin:6px auto 14px;
  background:#1C1B22;border-radius:34px;
  padding:9px 9px 12px;
  box-shadow:0 14px 34px rgba(40,30,20,.28),0 0 0 2px #0f0e13 inset;
  position:relative;
}
.phone-notch{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:96px;height:18px;background:#0f0e13;border-radius:0 0 14px 14px;z-index:3;
}
.phone-hd{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;font-weight:700;color:#EDE7E0;
  padding:7px 14px 6px;letter-spacing:.3px;
}
.phone-hd .ph-r{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#CFC7BE;}
.phone-body{
  background:linear-gradient(170deg,#FBEFF0 0%,#F1EAF6 46%,#E9F2F3 100%);
  border-radius:26px;padding:14px 13px 16px;min-height:430px;
  display:flex;flex-direction:column;
}
.phone-date{font-size:12.5px;color:#8A7F78;font-weight:600;padding:0 4px 8px;letter-spacing:.2px;}
.phone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 12px;padding:6px 2px 10px;}
.p-app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.p-app:active{transform:scale(.94);}
.pa-ic{
  width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:25px;line-height:1;color:#fff;
  box-shadow:0 5px 12px rgba(60,45,35,.20);
  transition:transform .15s,box-shadow .15s;
}
.p-app:hover .pa-ic{transform:translateY(-3px);box-shadow:0 9px 18px rgba(60,45,35,.26);}
.pa-n{font-size:11px;color:#4A423C;font-weight:600;text-align:center;line-height:1.25;}
/* App 图标配色 */
.pa-ig{background:linear-gradient(135deg,#F9CE34,#EE2A7B 55%,#6228D7);}
.pa-forum{background:linear-gradient(135deg,#3A8DDE,#1E5FA8);}
.pa-shop{background:linear-gradient(135deg,#FF9E4A,#F0603A);}
.pa-cal{background:linear-gradient(135deg,#FF6B6B,#E23E57);}
.pa-music{background:linear-gradient(135deg,#57C7E0,#2E7EC0);}
.pa-map{background:linear-gradient(135deg,#63C76A,#2F9E52);}
.pa-bank{background:linear-gradient(135deg,#8E7BE0,#5B46B8);}
.pa-status{background:linear-gradient(135deg,#7E8AA8,#4E5872);}
/* Dock */
.phone-dock{
  margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);
  border-radius:22px;padding:9px 10px;backdrop-filter:blur(6px);
}
.phone-dock .p-app .pa-ic{width:48px;height:48px;font-size:22px;border-radius:14px;
  box-shadow:0 4px 10px rgba(60,45,35,.18);}
.phone-dock .pa-n{font-size:10px;}
/* 屏幕（打开 App 后的全屏页） */
.phone-screen{
  flex:1;display:none;flex-direction:column;
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 4px 14px rgba(60,45,35,.14);
}
.phone-screen.on{display:flex;}
.phone-screen:empty{display:none;}
.app-h{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:#fff;
  border-bottom:1px solid #EFE7E0;position:sticky;top:0;z-index:2;
}
.app-back{
  width:30px;height:30px;flex:0 0 auto;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#FBF6F0;color:var(--accent);
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
  padding:0 2px 2px;
}
.app-back:active{background:#F2E9E0;}
.app-t{font-size:14.5px;font-weight:700;color:#3D3530;flex:1;text-align:left;}
.app-r{width:30px;flex:0 0 auto;}
.app-body{padding:12px 13px 18px;flex:1;overflow-y:auto;font-size:14px;color:#3D3530;
  max-height:520px;}


/* toast 容器 */
#toastBox{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
#toastBox .toast{background:rgba(43,38,34,.90);color:#FFFAF5;font-size:13px;font-weight:600;
  padding:8px 15px;border-radius:20px;box-shadow:0 6px 18px rgba(43,38,34,.22);
  white-space:nowrap;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;}
#toastBox .toast.on{opacity:1;transform:translateY(0);}


/* ===== 六步开局：进度条 / 底部 / 总览 ===== */
.setup-steps{
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;padding:4px 2px 14px;margin-bottom:4px;
  border-bottom:1px dashed var(--line);
}
.ss-dot{
  flex:1;height:6px;border-radius:4px;background:#EDE5DC;
  transition:background .2s;
}
.ss-dot.done{background:var(--accent);opacity:.55;}
.ss-dot.on{background:var(--accent);opacity:1;box-shadow:0 0 0 2px rgba(214,120,60,.18);}
.setup-foot{
  display:flex;gap:10px;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--line);
}
.setup-foot .btn-main{flex:1;}
.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:12px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:#6A6058;
  font-size:14px;font-weight:600;line-height:1;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-ghost:active{transform:scale(.97);}
.tag-rec{
  display:inline-block;margin-left:8px;padding:2px 8px;border-radius:9px;
  background:linear-gradient(135deg,#FF9E4A,#F0603A);color:#fff;
  font-size:10.5px;font-weight:700;vertical-align:middle;line-height:1.5;
}
.sum-grid{
  display:flex;flex-direction:column;gap:0;
  border:1.5px solid var(--line);border-radius:14px;overflow:hidden;
  background:#fff;margin:6px 0 4px;
}
.sum-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:10px 14px;font-size:13.5px;color:#5A5048;
  border-bottom:1px solid #F2EBE4;
}
.sum-row:last-child{border-bottom:none;}
.sum-row>span{color:#9A8E84;flex:0 0 auto;font-size:12.5px;}
.sum-row>b{color:#3D3530;font-weight:700;text-align:right;flex:1;line-height:1.5;}
.sum-row>div{text-align:right;flex:1;line-height:1.6;color:#3D3530;}

/* ===== 模态弹窗 ===== */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(43,38,34,.42);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  padding:18px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
.modal-mask.on{opacity:1;pointer-events:auto;}
.modal{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 18px 50px rgba(43,38,34,.28);padding:20px 18px 16px;
  transform:translateY(14px) scale(.98);transition:transform .18s ease;}
.modal-mask.on .modal{transform:translateY(0) scale(1);}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.modal-t{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:.2px;}
.modal-x{border:none;background:#F2ECE4;color:var(--sub);width:28px;height:28px;
  border-radius:50%;font-size:15px;line-height:1;cursor:pointer;}
.modal-s{font-size:12.5px;color:var(--sub);line-height:1.6;margin:0 0 12px;}
.modal-acts{display:flex;gap:8px;margin-top:14px;}
.modal-acts>button{flex:1;}
.modal-err{font-size:12px;color:var(--accent);margin-top:6px;min-height:15px;}

/* ===== 设置页 ===== */
.pref-sec{margin:14px 0;}
.pref-sec>.ps-t{font-size:12.5px;font-weight:800;color:var(--sub);
  letter-spacing:.6px;margin:0 0 7px 2px;text-transform:uppercase;}
.pref-row{display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;margin-bottom:7px;}
.pref-row .pr-l{font-size:14px;font-weight:600;color:var(--ink);}
.pref-row .pr-h{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5;}
.pref-row .pr-r{flex:0 0 auto;display:flex;gap:6px;align-items:center;}
.pref-in{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);
  border-radius:9px;padding:8px 10px;font-size:13.5px;color:var(--ink);font-family:inherit;}
.pref-in:focus{outline:none;border-color:var(--accent);}
.pref-lab{font-size:11.5px;color:var(--sub);font-weight:700;margin:8px 0 4px 2px;}
.mini-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;}
.mini-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.mini-btn:active{transform:scale(.97);}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:40px;height:40px;border-radius:11px;border:2px solid transparent;
  cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(192,57,43,.16);}
.swatch>span{position:absolute;left:4px;bottom:3px;font-size:9px;color:#fff;
  font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.55);}
.seg{display:flex;background:#F2ECE4;border-radius:10px;padding:3px;gap:3px;}
.seg>button{border:none;background:transparent;color:var(--sub);font-family:inherit;
  font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;}
.seg>button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.pref-note{font-size:11.5px;color:var(--sub);line-height:1.6;padding:2px 2px 0;}

/* ===== 皮肤主题 ===== */
body[data-skin="night"]{
  --paper:#201E28; --ink:#EDE8E1; --sub:#9B93A6; --line:#3A3543;
  --card:#2A2733;
  --sel-bg:#4A3A3F; --sel-fg:#F0DCD8;
}
body[data-skin="mint"]{
  --paper:#F2FAF5; --ink:#22332B; --sub:#7E938A; --line:#D8EAE0;
  --card:#FFFFFF; --accent:#1E8E5A;
  --sel-bg:#D5EBDF; --sel-fg:#1E5B41;
}
body[data-skin="sepia"]{
  --paper:#FBF4E6; --ink:#3B2E20; --sub:#94826B; --line:#E8DCC4;
  --card:#FFFDF7; --accent:#B4762A;
  --sel-bg:#EFDFC4; --sel-fg:#6B4218;
}
body[data-skin="night"] #topbar{background:rgba(32,30,40,.96);}
body[data-skin="night"] .phone-shell{background:#141319;}


/* ===== 显示开关生效 ===== */
body[data-noanim] *{transition:none!important;animation:none!important;}
body[data-compact] .card{padding:10px;margin:7px 0;}
body[data-compact] .pref-row{padding:8px 10px;margin-bottom:5px;}
body[data-compact] .bubble{margin:5px 0;}
body[data-compact] .narr{line-height:1.55;}

/* ===== 主页布局修复 ===== */
/* ============================================================
   布局修复：主页三段式（固定顶栏 / 内部滚动正文 / 吸附输入区）
   仅作用于 body.home-mode，不影响其他页面
   ============================================================ */

/* 桌面/宽屏：让 fixed 的导航栏与内容同宽、居中，不再横向拉满 */
@media (min-width:600px){
  #nav{
    max-width:520px;left:50%;right:auto;transform:translateX(-50%);
    border:1px solid var(--line);border-bottom:none;
    border-radius:14px 14px 0 0;
  }
}

/* 主页模式：整屏锁定，内部滚动 */
body.home-mode{
  padding-bottom:0;
  height:100dvh;height:100vh;
  overflow:hidden;
  display:flex;flex-direction:column;
}
body.home-mode #topbar{flex:none;}
body.home-mode .page{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:0 12px;
  max-width:520px;width:100%;margin:0 auto;
}

/* #app 填满剩余空间，内部再分：滚动区 + 输入区 */
body.home-mode #app{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  position:relative;
  /* 给底部导航留位 */
  padding-bottom:0;
}


/* 场景滚动区：唯一可滚动区域 */
body.home-mode .scene-wrap{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  gap:0;padding:0;
  overflow:hidden;
}
body.home-mode #flow{
  flex:1;min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px 0 18px;
}

/* 选项/输入区：吸附在滚动区下方，永远在导航栏之上 */
body.home-mode #choices{
  flex:none;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
  margin:0;
  max-height:34vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  display:none;
}
body.home-mode #choices.on{display:flex;flex-direction:column;}
body.home-mode #choices.on{max-height:22vh;}
body.home-mode #choices .btn-main{font-size:13px;padding:8px 12px;}

/* 输入行本身再收紧一点 */
body.home-mode .free-row{margin-top:0;}
body.home-mode #choices .btn-main{margin:0 0 5px;padding:7px 11px;font-size:12.5px;line-height:1.3;}
/* 建议选项：轻量化——透明底、无全框、细左标记、更短更小 */
body.home-mode #choices .btn-main{background:transparent;border:0;border-left:2px solid #E7DACD;
  margin:0 0 3px;padding:5px 8px 5px 10px;font-size:12px;line-height:1.25;color:#5C534B;border-radius:0 8px 8px 0;}
body.home-mode #choices .btn-main:active{background:#FFF3EE;border-left-color:var(--accent);}
body.home-mode #choices .btn-main .opt-h{font-size:10px;opacity:.72;}
body.home-mode #choices .btn-main:last-of-type{margin-bottom:0;}
body.home-mode #choices .btn-main .risk{font-size:10.5px;margin-top:1px;}

/* 底部导航：主页模式下不再需要 body padding 让位，交给 flex 布局
   但 #nav 仍是 fixed，需给 #app 底部留出等高于 nav 的间距 */
body.home-mode #nav{padding-bottom:env(safe-area-inset-bottom,0px);}
body.home-mode .page{padding-bottom:0;}
/* 导航栏高 58px + 安全区；用 CSS 变量统一，避免与 fixed nav 重叠或留缝 */
body.home-mode #app{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));}

/* 若浏览器不支持 dvh，回退 100vh 已在上面声明 */

/* 夜校皮肤下输入区/导航底色跟随 */
body[data-skin="night"].home-mode #choices{background:var(--paper);}

/* ============================================================
   v3 修复：全局三段式布局（所有页面导航栏贴底 + 内容内部滚动）
   + 开局六步「选中即前进」+ 郑重设定文案
   ============================================================ */

/* —— 全局：锁定视口，页面变成 flex 列 —— */
html{height:100%;}
body{
  padding-bottom:0 !important;
  min-height:100dvh;
  height:100dvh;
  height:100vh;
  overflow:hidden;
  display:flex;flex-direction:column;
}
#topbar{flex:none;}
/* .page 填满 topbar 与 nav 之间的空间 */
.page{
  flex:1;min-height:0;
  max-width:520px;width:100%;margin:0 auto;
  padding:0 12px;
  display:flex;flex-direction:column;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  box-sizing:border-box;
}
/* 页面底衬：给固定在底部的导航让出空间 */
.page::after{content:'';display:block;flex:none;height:70px;
  padding-bottom:env(safe-area-inset-bottom,0px);}

/* 导航栏：永远贴屏幕最底，宽屏时与内容同宽居中 */
#nav{position:fixed;bottom:0;left:0;right:0;
  padding-bottom:env(safe-area-inset-bottom,0px);}
@media (min-width:600px){
  #nav{max-width:520px;left:50%;right:auto;transform:translateX(-50%);
    border:1px solid var(--line);border-bottom:none;
    border-radius:14px 14px 0 0;}
}

/* —— 主页：顶栏/正文/输入区三段式 —— */
body.home-mode #app{overflow:hidden;display:flex;flex-direction:column;}
body.home-mode .scene-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
body.home-mode #flow{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
body.home-mode #choices{
  flex:none;background:var(--paper);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin:0;
  max-height:52vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none;
}
body.home-mode #choices.on{display:flex;flex-direction:column;}
/* 选项区按内容自适应，不强行撑高，底部不残留空白 */
body.home-mode #choices.on{max-height:22vh;}
body.home-mode #choices{justify-content:flex-start;}
body.home-mode .free-row{margin-top:8px;}
body.home-mode .page::after{height:0;}

/* —— 开局六步：底部按钮条吸附在导航之上 —— */
.page.setup-mode{overflow:hidden;padding-bottom:0;}
.page.setup-mode::after{display:none;}
.setup-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.setup-foot{
  flex:none;position:sticky;bottom:0;
  background:var(--paper);border-top:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;margin-top:8px;
}
.setup-foot .btn-main{flex:1;}
.setup-foot .btn-ghost{flex:none;min-width:92px;}
/* 步骤条吸附顶部 */
.setup-steps{
  position:sticky;top:0;z-index:5;background:var(--paper);
  padding:8px 0 10px;
}

/* —— 郑重设定文案：字段标签与输入框 —— */
.set-lab{
  font-size:13px;font-weight:700;color:#5A5048;letter-spacing:.04em;
  margin:12px 0 5px;display:flex;align-items:baseline;gap:6px;
}
.set-lab::after{content:'';flex:1;height:1px;background:var(--line);}
.set-in{
  width:100%;box-sizing:border-box;padding:11px 12px;
  border:1.5px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font-size:14.5px;
  font-family:inherit;outline:none;
}
.set-in:focus{border-color:var(--accent);}
.set-in::placeholder{color:#B8AFA4;}
.set-note{font-size:12px;color:var(--sub);margin:-2px 0 2px;line-height:1.5;}



/* ---- 预设选项 chips + 随机 ---- */
.set-note{font-size:12px;color:var(--sub);margin:-2px 0 2px;line-height:1.5;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:#6B6157;cursor:pointer;font-family:inherit;line-height:1.3;
  -webkit-tap-highlight-color:transparent;}
.chip:active{transform:scale(.96);}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:#FFF4EE;}
.set-or{display:block;text-align:center;font-size:11.5px;color:#B8AFA4;margin:6px 0 -2px;}
.rand-btn{width:100%;margin:14px 0 2px;padding:12px;border-radius:12px;
  border:1.5px dashed var(--accent);background:#FFF8F4;color:var(--accent);
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.rand-btn:active{transform:scale(.985);}


.lock-tag{font-size:10.5px;font-weight:600;color:#9A8E84;background:#F1EDE8;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.set-in:disabled{background:#F6F2ED;color:#9A8E84;border-style:dashed;}

/* ===== IG 分界 / 评论 ===== */
.ig-sep{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:11.5px;
  font-weight:700;color:#A79A8E;letter-spacing:.04em;}
.ig-sep::before,.ig-sep::after{content:'';flex:1;height:1px;background:#EDE6DE;}
.ig-card{border-left:3px solid #E0D8CE;padding-left:9px;margin-bottom:12px;}
.ig-cbox{margin:7px 0 2px;padding:8px 10px;background:#FBF7F2;border-radius:10px;}
.ig-crow{display:flex;gap:7px;margin-top:8px;}

/* ---------- 人名显示统一出口（受设置 showCn / showSex 控制） ----------
   显示规则（主名恒为英文原名，附加信息放括号里）：
    ① 主名：英文原名（该角色无英文名时才退回中文名）
    ② showCn 开 → 括号内补中文音译
    ③ showSex 开 → 括号内补性别
    ④ 两开关共用一个括号：中文名在前、性别在后，以「 · 」分隔
    例：Chad Whitmore（查德 · 男）／ Chad Whitmore（查德）／ Chad Whitmore（男）／ Chad Whitmore
    临时角色（不在名单里）：只有一个名字，无附加信息。
 ------------------------------------------------------------------ */
function showCn(){
  try{ return (typeof PREF!=='undefined' && PREF)? (PREF.showCn!==false) : true; }catch(e){ return true; }
}
function showSex(){ try{ return !(typeof PREF!=='undefined' && PREF && PREF.showSex===false); }catch(e){ return true; } }

/* 找到某名字（英文全名 / 首名 / 中文名 / IG handle）对应的固定角色，支持模糊匹配 */
function _findByName(s){
  if(!s) return null;
  var key=String(s).trim();
  var lk=key.toLowerCase();
  /* 归一化：去掉常见 handle 装饰（点/下划线/数字），便于 "luna.kimm" → "luna kimm" */
  var norm=lk.replace(/[._\-0-9]+/g,' ').replace(/\s+/g,' ').trim();
  var first=norm.split(' ')[0];
  return CHARS.find(function(c){
    var full=String(c.name||'').toLowerCase();
    var f1=full.split(' ')[0];
    var cf=String(c.cn||'');
    /* ① 全名/首名精确 ② 中文名精确 ③ handle 归一化后与全名或首名一致 ④ 昵称包含关系
       ⑤ 粘连 handle：如 "madisonreyes" 以首名/全名开头（去空格后） */
    var flat=norm.replace(/\s+/g,'');
    var fullFlat=full.replace(/\s+/g,'');
    return full===lk || f1===first
        || cf===key
        || norm===full || norm===f1
        || (norm.length>=4 && full.indexOf(norm)>=0)
        || (norm.length>=4 && norm.indexOf(full)>=0)
        || (f1.length>=4 && flat.indexOf(f1)===0)
        || (fullFlat.length>=4 && flat.indexOf(fullFlat)===0);
  }) || null;
}

/* 组装括号附加内容：中文音译 / 性别，共用一个括号（中文在前、性别在后，· 分隔） */
function nameSuffix(c){
  if(!c) return '';
  var parts=[];
  if(showCn() && c.cn) parts.push(String(c.cn));
  if(showSex() && c.gender) parts.push(String(c.gender));
  return parts.length? ('（'+parts.join('·')+'）') : '';
}

/* 固定角色：主名=英文原名（无英文名时退回中文名）+ 括号附加 */
function cnName(c){
  if(!c) return '';
  var base=String(c.name||c.cn||'');
  return base + nameSuffix(c);
}
/* 兼容旧调用：仅要“主名”，不带括号 */
function cnBase(c){
  if(!c) return '';
  return String(c.name||c.cn||'');
}
/* 适用于字符串名字（IG 帖子里的 user / npc_lines 等） */
function dispName(s){
  if(!s) return '';
  var i=_findByName(s);
  if(i) return cnName(i);
  return s;
}
/* 仅主名版本（不带括号），适配不适合括号的窄排版 */
function dispBase(s){
  if(!s) return '';
  var i=_findByName(s);
  if(i) return cnBase(i);
  return s;
}
/* 玩家名字显示：主名=pl.name（英文/原名）+ 括号补中文名(若开关且有) · 性别(若开关) */
function playerDispName(){
  try{
    var pl=(typeof S!=='undefined' && S && S.player) || {};
    var base=String(pl.name||'我');
    var parts=[];
    if(showCn() && pl.cn && String(pl.cn)!==base) parts.push(String(pl.cn));
    if(showSex() && pl.gender) parts.push(String(pl.gender));
    return parts.length? (base+'（'+parts.join('·')+'）') : base;
  }catch(e){ return '我'; }
}

function meetFromScene(sc){

    var key = String(nm).trim().toLowerCase();

      var first = full.split(' ')[0];
      var cn = String(x.cn||'');
      return full===key || first===key || cn===nm || cn===String(nm).trim();
    });
    if(!c) continue;                                  /* 路人/神秘线只出场一次，不入册 */
    if(S.npc_state[c.id] && S.npc_state[c.id].known) continue;
    knowNPC(c.id, '你第一次遇见了 '+c.name+'。');
    changed=true;
  }
  if(changed){ try{ saveGame(); }catch(e){} }
}

/* 生成节奏：控制最短视觉等待 / 温度微调 / 最大输出 */
function paceConf(){
  var p=CFG.pace||'normal';
  if(p==='fast') return {minMs:0,tempAdj:-0.05,maxTok:2200};
  if(p==='slow') return {minMs:2400,tempAdj:-0.12,maxTok:3000};
  return {minMs:1100,tempAdj:0,maxTok:(CFG.maxTokens||2600)};
}
function loadCfg(){
  try{ var s=localStorage.getItem(CFG_KEY);
    if(s){ var o=JSON.parse(s); for(var k in o){ if(o[k]!=null&&o[k]!=='') CFG[k]=o[k]; } } }catch(e){}
  return CFG;
}
function saveCfg(o){ if(o&&typeof o==='object'){ for(var k in o){ if(o[k]!=null) CFG[k]=o[k]; } } try{ localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); }catch(e){} }
function hasKey(){ return !!(CFG.apiKey && String(CFG.apiKey).length>8); }

/* ---------------- 存档层 ---------------- */
let S=null;
function newGame(name,grade,gender){
  var d=deepClone(TEMPLATE);
  if(!d.meet_log) d.meet_log={};
  d.meta.created=new Date().toISOString(); d.meta.version=2;
  d.player.name=name||'River';
  d.player.grade=grade||'高一';
  d.player.gender=gender||'女';
  d.schedule={year:1,week:1,day:0,events:[]};
  d.gm_memory={summary:'',recent:[],clues:{},scene_log:[]};
  d.log=[];
  return d;
}
function saveGame(){ if(!S) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){ toast('存档失败:'+e.message); } }
/* 存档自愈：补齐缺失关键字段，避免老存档/手改存档读到 undefined。
   作用于当前的 S（loadGame 与 importSave 共用），返回是否发生了修补。 */
function selfhealSave(){
  if(!S || typeof S!=='object') return false;
  var healed=false;
  if(!S.schedule){ S.schedule={year:1,week:1,day:0,events:[]}; healed=true; }
  if(S.schedule.year==null){ S.schedule.year=1; healed=true; }
  if(S.schedule.week==null){ S.schedule.week=1; healed=true; }
  if(S.schedule.day==null){ S.schedule.day=0; healed=true; }
  if(!S.schedule.events){ S.schedule.events=[]; healed=true; }
  if(!S.meet_log){ S.meet_log={}; healed=true; }
  if(!S.npc_state){ S.npc_state={}; healed=true; }
  if(!S.gm_memory){ S.gm_memory={summary:'',recent:[],clues:{},scene_log:[]}; healed=true; }
  if(!S.player){ S.player={name:'River',grade:'高一',gender:'女'}; healed=true; }
  /* 玩家资料规范化：性别英文→中文；缺 cn 时按需补齐 */
  try{
    var _g=String(S.player.gender||'').trim();
    var _gm={male:'男',female:'女',m:'男',f:'女',man:'男',woman:'女',boy:'男',girl:'女'};
    if(_g && !/^[男女]$/.test(_g)){
      var _gn=_gm[_g.toLowerCase()];
      if(_gn){ S.player.gender=_gn; healed=true; }
    }
    if(S.player.gender==null) S.player.gender='';
  }catch(e){}
  if(!S.meta){ S.meta={created:new Date().toISOString(),version:2}; healed=true; }
  if(!S.relationships){ S.relationships={}; healed=true; }
  if(!S.log){ S.log=[]; healed=true; }
  /* 旧存档迁移：IG 动态统一转为「中文主显」。
     早期版本帖文为 [中文,英文] 成对或纯英文，逐条收敛为中文文本。 */
  try{
    var _ig=(S.npc_state&&S.npc_state._ig)||[];
    if(Array.isArray(_ig)){
      for(var _i=0;_i<_ig.length;_i++){
        var _p=_ig[_i]; if(!_p||typeof _p!=='object') continue;
        if(Array.isArray(_p.text)){ _p.text=String(_p.text[1]==null?'':_p.text[1]); healed=true; }
        else if(_p.text && typeof _p.text==='object'){ _p.text=String(_p.text.zh||_p.text.text||''); healed=true; }
        if(_p.zh){ _p.text=_p.zh; delete _p.zh; healed=true; }
      }
    }
  }catch(e){}
  return healed;
}
function loadGame(){ try{ var s=localStorage.getItem(SAVE_KEY); if(!s) return null; S=JSON.parse(s); if(!S||typeof S!=='object') return null; selfhealSave(); return S; }catch(e){ return null; } }
function exportSave(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='northgate_save.json'; a.click();
}
function importSave(file){
  var r=new FileReader();
  r.onload=()=>{ try{ S=JSON.parse(r.result); if(!S||typeof S!=='object') throw new Error('bad'); if(typeof selfhealSave==='function') selfhealSave(); saveGame(); boot(); toast('存档已导入'); }catch(e){ toast('文件不是有效存档'); } };
  r.readAsText(file);
}

/* ---------------- 时间层 ---------------- */
const DAYS=['周一','周二','周三','周四','周五','周六','周日'];
function timeStr(){ if(!S) return ''; var sc=S.schedule; return 'Y'+sc.year+' 第'+sc.week+'周 '+DAYS[(sc.day||0)%7]; }
function advanceDay(){
  if(!S) return; var sc=S.schedule;
  /* ---- 暑假过渡周：独立计数，不占教学周 ---- */
  if(sc.gap){
    sc.gapDay=(sc.gapDay||0)+1;
    if(sc.gapDay>=7){
      sc.gap=false; sc.gapDay=0;
      sc.week=1; sc.day=0; sc.year=(sc.year||1)+1;   /* 暑假结束 → 新学年 */
    }
    if(typeof worldDayTick==='function') worldDayTick();
    return;
  }
  /* ---- 常规教学周推进 ---- */
  sc.day=(sc.day||0)+1;
  if(sc.day>=7){ sc.day=0; sc.week=(sc.week||1)+1; }
  /* 学年闭环：第36周结束 → 进入“学年结束·暑假”过渡周（gap）。
     保持 week/seasonOf 的 36 周映射不变，仅补上被省略的学年边界语义。 */
  if(sc.week>36){
    sc.gap=true; sc.gapDay=0;
    sc.week=37;                  /* 哨兵周：arcNote 见 gap 直接返回暑假，节日/剧情线暂停 */
    sc.day=0;
  }
  /* 世界先于主角运转：推进一天后，让世界自己动起来（不只是玩家打开 App 时） */
  if(typeof worldDayTick==='function') worldDayTick();
}
/* 学年是否处于暑假过渡周（供 UI / arcNote / 节日系统判空使用） */
function isSummerGap(){ try{ return !!(S && S.schedule && S.schedule.gap); }catch(e){ return false; } }
function addLog(txt){ if(!S) return; S.log=S.log||[]; S.log.unshift({t:timeStr(),v:txt}); if(S.log.length>80) S.log.length=80; }

/* ---------------- 季节 + 天气层 ----------------
   36 周一个学年，按加州湾区体感切四段：
   w1-8 秋 / w9-17 冬(多雨) / w18-26 春 / w27-36 夏
   天气用确定性伪随机（hash of year/week/day），同一天不跳变，跨天会变。 */
function seasonOf(week){
  var w=((week||1)-1)%36+1;
  if(w<=8)  return {k:'autumn', n:'秋',  emo:'🍂'};
  if(w<=17) return {k:'winter', n:'冬',  emo:'❄️'};
  if(w<=26) return {k:'spring', n:'春',  emo:'🌸'};
  return      {k:'summer', n:'夏',  emo:'☀️'};
}
/* 每个季节的天气池（weight 越大越常出现；temp 为典型温度区间） */
var WEATHER_POOL={
  autumn:[
    {t:'晴',   w:5, lo:66, hi:78},
    {t:'多云', w:4, lo:60, hi:72},
    {t:'阴',   w:2, lo:58, hi:68},
    {t:'小雨', w:2, lo:55, hi:64},
    {t:'大风', w:1, lo:57, hi:69},
    {t:'晨雾', w:2, lo:54, hi:66}
  ],
  winter:[
    {t:'小雨', w:5, lo:46, hi:56},
    {t:'大雨', w:3, lo:44, hi:54},
    {t:'阴',   w:4, lo:45, hi:55},
    {t:'多云', w:3, lo:48, hi:58},
    {t:'晴',   w:2, lo:50, hi:60},
    {t:'晨雾', w:2, lo:42, hi:52}
  ],
  spring:[
    {t:'晴',   w:4, lo:58, hi:72},
    {t:'多云', w:4, lo:56, hi:68},
    {t:'小雨', w:3, lo:54, hi:64},
    {t:'阴',   w:2, lo:55, hi:65},
    {t:'晨雾', w:2, lo:52, hi:62},
    {t:'大风', w:1, lo:56, hi:66}
  ],
  summer:[
    {t:'晴',   w:6, lo:68, hi:84},
    {t:'晴热', w:4, lo:76, hi:92},
    {t:'多云', w:3, lo:66, hi:80},
    {t:'晨雾', w:3, lo:58, hi:68},   /* 湾区夏雾 */
    {t:'大风', w:1, lo:64, hi:76}
  ]
};
function _wHash(y,w,d){
  var x=(y*73856093)^(w*19349663)^((d+1)*83492791);
  x=(x^(x>>>13))*1274126177; x=x^(x>>>16); return Math.abs(x);
}
/* 返回 {k,n,emo,temp,txt} —— 确定性，同一天稳定 */
function weatherAt(year,week,day){
  var sea=seasonOf(week);
  var pool=WEATHER_POOL[sea.k]||WEATHER_POOL.spring;
  var total=0; for(var i=0;i<pool.length;i++) total+=pool[i].w;
  var r=_wHash(year||1,week||1,day||0)%total, acc=0, pick=pool[0];
  for(var j=0;j<pool.length;j++){ acc+=pool[j].w; if(r<acc){ pick=pool[j]; break; } }
  var temp=pick.lo+(_wHash(year||1,week||1,(day||0)+7)%(pick.hi-pick.lo+1));
  return {k:sea.k, n:sea.n, emo:sea.emo, t:pick.t, temp:temp,
          txt:sea.emo+' '+sea.n+' · '+pick.t+' '+temp+'°F'};
}
</script>



<script>
/* ============================================================
   Part 3B : AI 调用 / GM Prompt / JSON 解析 / 状态应用
   ============================================================ */

/* ---------------- AI 调用层 ---------------- */
async function callAI(messages, useJson){
  if(!hasKey()) throw new Error('NOKEY');
  var body={
    model: CFG.model||'deepseek-chat',
    messages: messages,
    temperature: Math.max(0.3,(CFG.temp!=null?CFG.temp:1.0)+paceConf().tempAdj),
    max_tokens: paceConf().maxTok,
    stream: false
  };
  if(useJson) body.response_format={type:'json_object'};
  var res=await fetch(CFG.baseUrl,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.apiKey},
    body: JSON.stringify(body)
  });
  if(!res.ok){
    var t=''; try{ t=await res.text(); }catch(e){}
    var msg='API '+res.status;
    if(res.status===401) msg='API Key 无效或未授权 (401)';
    else if(res.status===402) msg='余额不足 (402)';
    else if(res.status===429) msg='请求过于频繁 (429)';
    else if(res.status>=500) msg='服务端错误 ('+res.status+')';
    throw new Error(msg+(t?(' | '+t.slice(0,160)):''));
  }
  var data=await res.json();
  var content=data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if(!content) throw new Error('返回内容为空');
  return content;
}

/* ---------------- JSON 容错解析 ---------------- */
function parseJSON(txt){
  var s=String(txt||'').trim();
  s=s.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  var i=s.indexOf('{'), j=s.lastIndexOf('}');
  if(i>=0 && j>i) s=s.slice(i,j+1);
  try{ return JSON.parse(s); }catch(e){}
  s=s.replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(s); }catch(e){}
  return null;
}

/* ---------------- 角色速查 ---------------- */
function charById(id){ for(var i=0;i<CHARS.length;i++){ if(CHARS[i].id===id) return CHARS[i]; } return null; }
function charByName(n){
  if(!n) return null;
  n=String(n).trim();
  for(var i=0;i<CHARS.length;i++){ var c=CHARS[i];
    if(c.name===n) return c;
    if(c.name.split(' ')[0].toLowerCase()===n.toLowerCase()) return c;
    if(c.name.split(' ').pop().toLowerCase()===n.toLowerCase()) return c;
  }
  return null;
}
function relKey(n){ var c=charByName(n); return c? c.id : null; }

/* ---------------- GM System Prompt ---------------- */

/* ===== 三年剧情线引擎（匿名信 / Prom丑闻 / 毕业典礼 三线） =====
   取自《美高模拟器》设定：三线交织，跨 year1→year3 推进。
   key 严格对齐存档 S.story_flags.yearX.key —— 无需改任何既有字段。 */
var STORY_ARCS=[
  /* —— Year 1 · 高一：埋线（冰作剧 / 流言线 / 失窃目击）—— */
  {y:1,w:6, dur:4, key:'冰作剧',   line:'year1', t:'冰作剧·前兆',   h:'更衣室发生小规模恶作剧（训练服被冻/更衣柜被翻），Varsity 内部开始互相猜忌。'},
  {y:1,w:12,dur:4, key:'流言线',   line:'year1', t:'流言线·起点',   h:'关于某个北部新生的流言在 IG 小号上传开，真假难辨，南部圈开始拿它当谈资。'},
  {y:1,w:20,dur:5, key:'失窃目击', line:'year1', t:'失窃目击',      h:'有人看见体育器材室的异常一幕（物品失窃/盘问现场），但目击者选择沉默。'},
  /* —— Year 2 · 高二：爆发（匿名信 / 双派对 / 四分卫之争 / 权力真空）—— */
  {y:2,w:3, dur:5, key:'匿名信1',  line:'year2', t:'第一封匿名信',  h:'第一封匿名信寄到学生会信箱，措辞精确得像内部人所写，指向上一年的旧事。'},
  {y:2,w:11,dur:5, key:'匿名信2',  line:'year2', t:'第二封匿名信',  h:'第二封匿名信出现，收信人换了，内容开始点名，社交圈炸锅。'},
  {y:2,w:16,dur:4, key:'双派对冲突',line:'year2',t:'双派对正面撞车', h:'北部泳池趴与南部车库趴被故意安排在同一天，两边都拉人，中立者被迫选边。'},
  {y:2,w:22,dur:6, key:'四分卫之争',line:'year2', t:'四分卫之争',    h:'主力四分卫爆出丑闻/受伤，替补与转学生开始争夺首发，Varsity 更衣室裂成两派。'},
  {y:2,w:30,dur:6, key:'权力真空',  line:'year2', t:'权力真空',      h:'学生会主席 / 球队队长因故出缺，各方开始抢位，谁上位将决定第三年的格局。'},
  /* —— Year 3 · 高三：终局（申请季 / Prom舞弊 / 毕业典礼异象 / 真相揭晓）—— */
  {y:3,w:4, dur:8, key:'申请季',     line:'year3', t:'申请季',       h:'Early Decision 截止临近，成绩/推荐信/活动包装变成新的战场，人人自危。'},
  {y:3,w:26,dur:4, key:'Prom舞弊',   line:'year3', t:'Prom 舞弊',    h:'Prom Court 计票被曝出舞弊，提名名单可能要作废重来，牵扯到前两年的旧账。'},
  {y:3,w:34,dur:3, key:'毕业典礼异象',line:'year3', t:'毕业典礼异象', h:'毕业典礼筹备期间出现异常（神秘缺席者/被撕掉的名册/连串恶作剧），所有人都在猜。'},
  {y:3,w:36,dur:3, key:'真相揭晓',   line:'year3', t:'真相揭晓',     h:'两封匿名信与 Prom 舞弊的真相即将浮出水面，谁写的、为何写，决定谁的青春被改写。'}
];
var ARC_LINE_NAME={year1:'高一·埋线',year2:'高二·爆发',year3:'高三·终局'};

/* 触发：比对当前 year/week，激活到期的剧情线（幂等，只触发一次） */
function arcTick(){
  if(!S) return [];
  var sc=S.schedule||{}; var y=sc.year||1, w=sc.week||1;
  S.story_flags=S.story_flags||{};
  S.suspense=S.suspense||{匿名信线索:[],Prom丑闻线索:[],毕业典礼线索:[],揭露进度:0};
  var fired=[];
  for(var i=0;i<STORY_ARCS.length;i++){
    var a=STORY_ARCS[i];
    if(a.y!==y) continue;
    if(a.w>w) continue;                 /* 还没到 */
    var bucket=S.story_flags[a.line]||(S.story_flags[a.line]={});
    if(bucket[a.key]) continue;         /* 已触发，幂等 */
    bucket[a.key]=true;
    bucket[a.key+'__w']=w;   /* 记录触发周，供 arcNote 判定持续期 */
    fired.push(a);
    /* 把线索记进 suspense（供结局揭露进度统计） */
    var slot = a.line==='year2' ? '匿名信线索' : (a.line==='year3'&&/Prom/.test(a.key)?'Prom丑闻线索':(a.line==='year3'?'毕业典礼线索':null));
    if(slot && S.suspense[slot] && S.suspense[slot].length<12){
      S.suspense[slot].push('Y'+a.y+'W'+a.w+'·'+a.t);
    }
    /* 揭露进度（0-100）：已触发线 / 总线条 加权 */
    try{
      /* 分母 = 截至当前年已解锁的线（Y1=3 / Y2=8 / Y3=12），否则进度永远卡在低位 */
      var total=0, done=0;
      for(var k=0;k<STORY_ARCS.length;k++){
        var ak=STORY_ARCS[k];
        if(ak.y>y) continue;              /* 尚未进入的年份不计入分母 */
        total++;
        var bb=S.story_flags[ak.line]||{};
        if(bb[ak.key]) done++;
      }
      /* 另加上“已结案”的线也算揭露完成（双重保障，与 active 判定一致） */
      S.suspense['揭露进度']= total? Math.round(done/total*100) : 0;
    }catch(e){}
  }
  if(fired.length){ try{ saveGame(); }catch(e){} }
  return fired;
}

/* 读到 prompt 里：告诉 AI 本阶段该演哪条线 */
function arcNote(){
  if(!S) return '';
  var sc=S.schedule||{}; var y=sc.year||1, w=sc.week||1;
  if(sc.gap) return '【本阶段背景：暑假】学年已结束，校园进入暑假，剧情线与节日全部暂停，叙述以假期生活/回顾为主。';
  S.story_flags=S.story_flags||{};
  var active=[], soon=[], done=[];
  S.story_done=S.story_done||{};
  for(var i=0;i<STORY_ARCS.length;i++){
    var a=STORY_ARCS[i];
    var bb=S.story_flags[a.line]||{};
    if(bb[a.key]){
      /* 已触发：看是否还在持续期内（触发周存于 key+'__w'，缺省回退 a.w） */
      var sw=(bb[a.key+'__w']!=null? bb[a.key+'__w'] : a.w);
      var dur=(a.dur!=null? a.dur : 4);
      if(a.y===y && w>=sw && w<=sw+dur){
        active.push(a);                 /* 进行中 */
      } else if(a.y===y && w>sw+dur){
        var dk=a.line+'::'+a.key;       /* 已过持续期 → 结案（幂等） */
        if(!S.story_done[dk]){ S.story_done[dk]={y:a.y,w:sw,end:sw+dur,key:a.key,t:a.t}; }
        done.push(a);
      }
    } else if(a.y===y && a.w>=w && a.w<=w+3){ /* 4 周内将触发 */
      soon.push(a);
    }
  /* —— 节日线：本周 + 临近 3 周（CAL_EVENTS 定义在后面的 script 块，运行时已就绪，做防御性判空）—— */
  var festNow=[], festSoon=[];
  if(typeof CAL_EVENTS!=='undefined' && CAL_EVENTS.length){
    for(var f=0;f<CAL_EVENTS.length;f++){
      var e=CAL_EVENTS[f];
      if(e.w===w) festNow.push(e);
      else if(e.w>w && e.w<=w+3) festSoon.push(e);
    }
  }
  if(!active.length && !soon.length && !festNow.length && !festSoon.length) return '';
  var hasArc=(active.length||soon.length);
  var L=[hasArc ? '【本阶段剧情主线（请自然融入叙事，勿生硬点破）】' : '【本阶段背景线索（请自然融入叙事，勿生硬点破）】'];
  L.push('当前学期：'+ARC_LINE_NAME['year'+y]+'（第 '+y+' 学年 · 第 '+w+' 周）');
  if(active.length){
    L.push('—— 进行中的线 ——');
    for(var j=0;j<active.length;j++){
      L.push('· '+active[j].t+'：'+active[j].h);
    }
  }
  if(soon.length){

    (function(){ var an=arcNote(); return an? ('【剧情线】'+an.split('\n').slice(1,3).join(' / ')) : ''; })(),
    (function(){
      try{
        var wk=(S.schedule&&S.schedule.week)||1, ns=[];
        if(typeof CAL_EVENTS!=='undefined'){
          for(var i=0;i<CAL_EVENTS.length;i++){
            var e=CAL_EVENTS[i];
            if(e.w===wk) ns.push(e.n+'('+e.t+'·'+e.c+')');
          }
        }
        return ns.length? ('【本周节日】'+ns.join('；')+' —— forum/ig 内容须贴合该节日') : '';
      }catch(e){ return ''; }
    })(),
    (function(){
      try{
        var sc=S.schedule||{year:1,week:1,day:0};
        var wx=weatherAt(sc.year||1, sc.week||1, sc.day||0);
        var ac=(typeof activeCircles==='function')?activeCircles(sc.week||1):{now:[],fest:false};
        var s='【本周时令】'+wx.txt+' ｜ 主场圈层：'+(ac.now.join('/')||'—');

/* ---------------- 状态应用 ---------------- */
function applyDelta(d){
  if(!d || !S) return;
  var a=S.attributes||{}, res=S.resources||{}, so=S.social||{};
  if(d.attributes){ for(var k in d.attributes){ if(a[k]==null) a[k]=0; a[k]=clamp(Math.round(a[k]+ (Number(d.attributes[k])||0)),0,100); } }
  if(d.resources){
    var rr=d.resources, up=(res['上限']||{});
    if(rr['体力']!=null) res['体力']=clamp(Math.round((res['体力']||0)+Number(rr['体力'])),0, up['体力']||100);
    if(rr['精力']!=null) res['精力']=clamp(Math.round((res['精力']||0)+Number(rr['精力'])),0, up['精力']||100);
    if(rr['心情']!=null) res['心情']=clamp(Math.round((res['心情']||0)+Number(rr['心情'])),0,100);
    if(rr['现金']!=null) res['现金']=Math.max(0, Math.round((res['现金']||0)+Number(rr['现金'])));
  }
  if(d.social && d.social['人气值']!=null){ so['人气值']=clamp(Math.round((so['人气值']||0)+Number(d.social['人气值'])),0,100); }
  if(d.npc){
    S.relationships=S.relationships||{};
    for(var nk in d.npc){
      var id=relKey(nk)||nk;
      var cur=(S.relationships[id]!=null? S.relationships[id] : 0);
      S.relationships[id]=clamp(Math.round(cur + Number(d.npc[nk])), -50, 100);
    }
  }
  S.attributes=a; S.resources=res; S.social=so;
}

/* ---------------- 记忆写入 ---------------- */
function pushMemory(entry){
  if(!S) return;
  S.gm_memory=S.gm_memory||{summary:'',recent:[],clues:{},scene_log:[]};
  S.gm_memory.recent=S.gm_memory.recent||[];
  S.gm_memory.scene_log=S.gm_memory.scene_log||[];
  S.gm_memory.recent.unshift(entry);
  if(S.gm_memory.recent.length>20) S.gm_memory.recent.length=20;
}

/* ---------- 通用渲染工具 ---------- */
function bubble(name,circle,text){
  var c=charByName(name);
  /* 人名统一走显示出口：受设置 showCn 控制 */
  var cn=c? cnName(c) : dispName(name);
  var cc=c? c.circle : (circle||'');
  var k=ckey(cc|| (c?c.circle:''));
  /* 固定角色：主名已由 cnName 决定（中文名或英文名）；
     临时角色：只有一个名字，直接显示，不再拼括号副本。 */
  return '<div class="bub c-'+k+'"><div class="bub-h"><span class="bub-n">'+esc(cn)+'</span></div>'
    +'<div class="bub-t">'+esc('“'+text+'”')+'</div></div>';
}
function optionBtn(o,i){
  return '<button class="btn-main" data-opt="'+i+'">'
    +'<span class="opt-t">'+esc(o.text)+'</span>'
    +'<span class="opt-h">'+esc(o.hint||'')+'</span></button>';
}

/* ---------- 主页：追加一段叙事 ---------- */
/* 叙事切分：把一整段旁白拆成 2-4 个视觉分段，避免“一大坨” */
function _splitNarr(txt){
  var t=String(txt||'').trim();
  if(!t) return [];
  /* 优先按显式换行切 */
  var parts=t.split(/\n+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
  /* 单行且过长 → 引号感知切句（不在「」内切），再合并成 2-4 段 */
  if(parts.length<=1 && t.length>60){
    var sents=_splitSentences(t);
    if(sents.length>1){
      var per=Math.ceil(sents.length/Math.min(3, Math.max(2, Math.ceil(sents.length/2))));
      parts=[];
      for(var i=0;i<sents.length;i+=per){ parts.push(sents.slice(i,i+per).join('')); }
    }
  }
  /* 段数兜底：>4 段则把尾部合并 */
  if(parts.length>4){
    var head=parts.slice(0,3), tail=parts.slice(3).join('');
    parts=head.concat([tail]);
  }
  return parts;
}
/* 每段一个颜色标记（四色轮换，仅做视觉分层，不再渲染文字） */
/* 引号感知分句：「」 内不切；—— 仅作软边界；合并尾部碎片 */
function _splitSentences(t){
  t=String(t||'');
  var out=[], buf='', inQ=false, i=0, n=t.length;
  var OPEN='「“『', CLOSE='」”』';
  var END='。！？…~!?';
  while(i<n){
    var ch=t.charAt(i);
    if(OPEN.indexOf(ch)>=0){ inQ=true; buf+=ch; i++; continue; }
    if(CLOSE.indexOf(ch)>=0){ inQ=false; buf+=ch; i++; continue; }
    if(ch==='—' && !inQ && buf.trim().length>=24){
      var n2=t.charAt(i+1);
      if(n2==='—'){ i+=2; } else { i+=1; }
      out.push(buf.trim()); buf='';
      continue;
    }
    buf+=ch;
    if(!inQ && END.indexOf(ch)>=0){
      var nx=t.charAt(i+1);
      if(END.indexOf(nx)>=0){ i++; continue; }
      if(CLOSE.indexOf(nx)>=0){ continue; }
      out.push(buf.trim()); buf='';
    }
    i++;
  }
  if(buf.trim()) out.push(buf.trim());
  if(out.length>1){
    var last=out[out.length-1];
    if(last.length<12 && last.indexOf('「')<0 && last.indexOf('“')<0){
      out[out.length-2]+=last; out.pop();
    }
  }
  if(out.length>1 && out[0].length<12 && out[0].indexOf('」')<0){
    out[1]=out[0]+out[1]; out.shift();
  }
  return out;
}
var _NARR_TAGS=[
  {k:'narr-scene'},
  {k:'narr-move'},
  {k:'narr-voice'},
  {k:'narr-beat'}
];
function _narrClass(i){
  return _NARR_TAGS[i % _NARR_TAGS.length].k;
}
function sceneHTML(sc){
  var h='';
  var segs=_splitNarr(sc.narration);
  if(!segs.length){
    h+='<div class="narr">'+esc(sc.narration||'').replace(/\n/g,'<br>')+'</div>';
  }else{
    h+='<div class="narr-box">';
    segs.forEach(function(seg,i){
      h+='<div class="narr-seg '+_narrClass(i)+'">'
        +'<div class="narr-body">'+esc(seg).replace(/\n/g,'<br>')+'</div>'
        +'</div>';
    });
    h+='</div>';
  }
  var nl=sc.npc_lines||[];
  if(nl.length){
    h+='<div class="npc-wrap">';
    for(var i=0;i<nl.length;i++){ h+=bubble(nl[i].name, nl[i].circle, nl[i].text); }
    h+='</div>';
  }
  return h;
}
function appendScene(sc){
  var flow=$('#flow'); if(!flow) return;
  var wrap=document.createElement('div'); wrap.className='turn';
  wrap.innerHTML=sceneHTML(sc);
  flow.appendChild(wrap);
  flow.scrollTop=flow.scrollHeight;
  try{ bindEditable(); }catch(e){}
}
function showOptions(sc){
  var box=$('#choices'); if(!box) return;
  var h='';
  var talking=(sc&&sc.talking_to&&sc.talking_to.length)? sc.talking_to : null;
  if(talking){
    /* 当前有 NPC 正等着主角开口 → 进入对话模式 */
    FACE_CTX={ who:talking[0], list:talking };
    h+='<div class="talk-bar"><span class="talk-tip">💬 正在和 '+esc(cnName(charById(talking[0]))||talking[0])+' 说话</span>'
      +'<button class="talk-exit" id="talkExit">结束对话</button></div>';
    h+='<div class="free-row"><input id="freeIn" class="free-in talk-in" placeholder="开口说…"><button id="freeGo" class="free-go">说</button></div>';
    box.innerHTML=h;
    box.classList.add('on');
    bindChoices(sc);
    flowScroll();
    return;
  }
  FACE_CTX=null;
  var opts=sc.options||[];
  for(var i=0;i<opts.length;i++) h+=optionBtn(opts[i], i);
  h+='<div class="free-row"><input id="freeIn" class="free-in" placeholder="也可以直接输入你想说的话/做的事…"><button id="freeGo" class="free-go">发送</button></div>';
  box.innerHTML=h;
  box.classList.add('on');
  bindChoices(sc);
  flowScroll();
}
function hideOptions(){ var b=$('#choices'); if(b){ b.classList.remove('on'); b.innerHTML=''; } }
function flowScroll(){ var f=$('#flow'); if(f) setTimeout(()=>{ f.scrollTop=f.scrollHeight; },50); }
/* ============================================================
   长按编辑（容错）：我的行动/台词改 1 次；双方消息各改 2 次
   ============================================================ */
var EDIT_LIMIT={ mine:1, msg:2, npcmsg:2 };
/* 长按绑定：位移阈值 8px 内且 550ms 以上算长按，避免与滚动冲突 */
function bindLongPress(el, fn){
  if(!el || el._lp) return; el._lp=true;
  var t=null, x0=0, y0=0, fired=false;
  function start(e){
    var p=e.touches? e.touches[0] : e;
    x0=p.clientX; y0=p.clientY; fired=false;
    t=setTimeout(function(){ fired=true; try{ fn(el); }catch(err){} }, 550);
  }
  function move(e){
    if(!t) return;
    var p=e.touches? e.touches[0] : e;
    if(Math.abs(p.clientX-x0)>8 || Math.abs(p.clientY-y0)>8){ clearTimeout(t); t=null; }
  }
  function end(){ if(t){ clearTimeout(t); t=null; } }
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove',  move,  {passive:true});
  el.addEventListener('touchend',   end);
  el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',  start);
  el.addEventListener('mousemove',  move);
  el.addEventListener('mouseup',    end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); fn(el); });
}
/* 绑定主页内全部可编辑元素（幂等，可反复调用） */
function bindEditable(){
  $$('#flow .mine[data-mine]').forEach(function(el){ bindLongPress(el, onLongPressMine); });
  $$('.ch-row .ch-bub').forEach(function(el){ bindLongPress(el, onLongPressMsg); });
}
/* 取该行动在 scene_log 里的序号（data-mine-i 由渲染时写入；缺失则取最后一条玩家行动） */
function _mineLogIdx(el){
  if(!S||!S.gm_memory||!S.gm_memory.scene_log) return -1;
  var log=S.gm_memory.scene_log;
  if(el.dataset.mineI!==undefined && el.dataset.mineI!==''){
    var k=+el.dataset.mineI; if(k>=0 && k<log.length) return k;
  }
  for(var i=log.length-1;i>=0;i--){ if(log[i] && log[i]._player!==undefined) return i; }
  return -1;
}
function onLongPressMine(el){
  var idx=_mineLogIdx(el);
  var rec=(idx>=0)? S.gm_memory.scene_log[idx] : null;
  var used=(rec && rec._edit_n)||0;
  if(used>=EDIT_LIMIT.mine){ toast('这条行动已经修改过了'); return; }
  var cur=(rec && rec._player!==undefined)? rec._player : el.textContent;
  var nv=prompt('修改你的行动：', cur);
  if(nv===null) return;
  nv=String(nv).trim(); if(!nv || nv===cur) return;
  if(rec){ rec._player=nv; rec._edit_n=used+1; }
  el.textContent=nv;
  try{ if(el.parentNode) el.parentNode.dataset.text=nv; }catch(e2){}
  if(typeof saveGame==='function') saveGame();
  toast('已修改（行动可改 1 次'+(rec?'，剩 '+(EDIT_LIMIT.mine-(used+1))+' 次':'')+'）');
}
function onLongPressMsg(el){
  var row=el.closest? el.closest('.ch-row') : null;
  var id=(typeof _MSG_OPEN!=='undefined' && _MSG_OPEN.cur)? _MSG_OPEN.cur : null;
  if(!id || !row) return;
  var arr=chatOf(id);
  /* 定位这条消息 */
  var body=el.closest('.ch-body');
  var rows=body? Array.prototype.slice.call(body.querySelectorAll('.ch-row')) : [];
  var i=rows.indexOf(row);
  if(i<0 || i>=arr.length) return;
  var m=arr[i];
  var isMe=!!m.me || row.classList.contains('me');
  /* NPC 的消息不允许编辑，改为「重新生成」 */
  if(!isMe){ regenMsg(id, i); return; }
  var lim=EDIT_LIMIT.msg;
  var used=m.edited||0;
  if(used>=lim){ toast('这条消息已经修改过 '+lim+' 次了'); return; }
  var nv=prompt('修改你发出的消息：', m.t||'');
  if(nv===null) return;
  nv=String(nv).trim(); if(!nv || nv===(m.t||'')) return;
  m.t=nv; m.edited=used+1;
  if(typeof saveGame==='function') saveGame();
  if(typeof openApp==='function') openApp('chat:'+id);
  toast('已修改（剩 '+(lim-(used+1))+' 次）');
}
/* 长按 NPC 消息 → 重新生成这一条 */
function regenMsg(id, i){
  if(typeof BUSY!=='undefined' && BUSY){ toast('正在生成，稍等一下'); return; }
  var c=charById(id); if(!c) return;
  var arr=chatOf(id);
  var m=arr[i]; if(!m || m.me) return;
  if(!hasKey()){ toast('还没有填 API Key'); return; }
  m._regen=1;
  toast('正在重新生成…');
  /* 上下文：该条之前的最近几条 */
  var before=arr.slice(Math.max(0,i-5), i).map(function(x){ return (x.me?'我：':'你：')+(x.t||''); }).join('\n');
  var persona=msgPersona(c,id);
  var stamp=chatStamp();
  callAI([
    {role:'system',content:persona},
    {role:'user',content:'【最近聊天记录】\n'+before+'\n\n请重新回复这一条（换一种说法，保持人设与情境一致）。'}
  ], false).then(function(r){
    var t2=(r&&String(r).trim())? String(r).trim() : _fallbackReply(c,arr);
    t2=t2.replace(/^[“”"'‘’]+/,'').replace(/[“”"'‘’]+$/,'').trim();
    t2=t2.replace(/^[\s\S]{0,2}[:：]\s*/,'');
    var pz=parseImgTag(t2); t2=pz.t;
    if(t2.length>60) t2=t2.slice(0,60);
    var img=pz.img; if(img.length>46) img=img.slice(0,46);
    if(!t2 && !img) t2=_fallbackReply(c,arr);
    m.t=t2; if(img) m.img=img; else delete m.img; m.time=stamp; delete m._regen;
    if(typeof saveGame==='function') saveGame();
    if(typeof openApp==='function') openApp('chat:'+id);
    toast('已重新生成');
  }).catch(function(){
    delete m._regen; toast('重新生成失败，请重试');
  });
}

function bindChoices(sc){
  $$('#choices .btn-main').forEach(function(b){
    b.onclick=function(){ var i=+b.dataset.opt; var o=(sc.options||[])[i]; if(o) sendAction(o.text); };
  });
  var fin=$('#freeIn');
  var fg=$('#freeGo');
  function submitFree(){
    var fi=$('#freeIn'); var v=fi?fi.value.trim():'';
    if(!v) return;
    if(fi) fi.value='';   /* Fix：发出即清空输入框，避免残留 */
    if(FACE_CTX && FACE_CTX.who) replyTo(FACE_CTX.who, v);
    else sendAction(v);
  }
  if(fin){
    fin.onkeydown=function(e){ if(e.key==='Enter'){ submitFree(); } };
  }
  if(fg) fg.onclick=submitFree;
  var tx=$('#talkExit');
  if(tx) tx.onclick=function(){ exitTalk(); };
}

/* ---------- loading 气泡 ---------- */
function showLoading(txt){
  var flow=$('#flow'); if(!flow) return;
  var d=document.createElement('div'); d.className='turn'; d.id='loadingTurn';
  d.innerHTML='<div class="loading"><span class="spin"></span>'+(txt||'剧情推进中…')+'</div>';
  flow.appendChild(d); flowScroll();
}
function killLoading(){ var d=$('#loadingTurn'); if(d) d.remove(); }

/* ---------- 错误提示 ---------- */
function showError(msg){
  killLoading();
  var flow=$('#flow'); if(!flow) return;
  var d=document.createElement('div'); d.className='turn';
  var extra='';
  if(msg.indexOf('NOKEY')>=0){ extra='<button class="btn-main" onclick="go(\'set\')"><span class="opt-t">去填 API Key</span><span class="opt-h">设置</span></button>'; }
  d.innerHTML='<div class="err"><b>⚠ 出错</b><div class="err-m">'+esc(msg)+'</div>'+extra+'</div>';
  flow.appendChild(d); flowScroll();
}

/* ---------- 核心：提交一次行动，跑一个 AI 回合 ---------- */
async function sendAction(text){
  if(BUSY) return;
  /* 固定开场（INTRO）期间不接受自由输入，避免打乱引导序列 */
  if(typeof INTRO!=='undefined' && INTRO.active && INTRO.active()){
    toast('先按提示往下走吧'); return;
  }
  if(!hasKey()){ showError('NOKEY 还没有填 API Key，无法生成剧情。'); go('set'); return; }
  BUSY=true; hideOptions();

  /* 玩家行动上屏 */
  var flow=$('#flow');
  if(flow){
    var d=document.createElement('div'); d.className='turn';
    d.innerHTML='<div class="mine" data-mine="1">'+esc(text)+'</div>';
    flow.appendChild(d); flowScroll();
  }
  showLoading();

  var sys=buildSystem();
  var state=buildState();
  var hist=(LAST_SCENE&&LAST_SCENE.narration)? ('上一幕：'+LAST_SCENE.narration.slice(0,300)) : '（这是开局第一幕：新生开学，你刚走进 Northgate High 的校园。）';
  var userMsg='【当前状态】\n'+state+'\n\n【剧情上下文】\n'+hist+'\n\n【玩家行动】\n'+text
    +'\n\n请推进剧情，按约定 JSON 输出。';

  var _t0=Date.now();
  try{
    var content=await callAI([
      {role:'system',content:sys},
      {role:'user',content:userMsg}
    ], true);
    var _w=paceConf().minMs-(Date.now()-_t0);
    if(_w>0) await new Promise(function(r){setTimeout(r,_w);});
    var sc=parseJSON(content);
    if(!sc){ throw new Error('AI 返回的不是有效 JSON'); }

    killLoading();
    appendScene(sc);
    /* 应用数值 */
    var before=snapshotNums();
    applyDelta(sc.state_delta||{});
    /* 本回合出场 NPC → 自动结识（第二写入方） */
    try{ meetFromScene(sc); }catch(e){}
    var after=snapshotNums();
    /* 时间推进：支持跨度
       - true  → 过 1 天（兼容旧格式）
       - 数字 n → 连推 n 天（1=过一天，2-3=过几天，7=过一周，最多 14 天防跑飞）
       - false/0 → 同场景内推进，不跳时间 */
    var _advN=0;
    if(sc.time_advance===true) _advN=1;
    else if(typeof sc.time_advance==='number' && sc.time_advance>0) _advN=Math.min(14, Math.floor(sc.time_advance));
    if(_advN>0){ for(var _ai=0;_ai<_advN;_ai++) advanceDay(); }
    /* 三年剧情线：按 year/week 触发。arcTick 返回“本回合刚刚触发”的线，
       把它们同步回落到本回合画面上（避免主线只存在于隐藏计数器里）。 */
    try{
      var _fired=arcTick();
      if(_fired && _fired.length){
        var _fl=$('#flow');
        if(_fl){
          for(var _i=0;_i<_fired.length;_i++){
            var _d=document.createElement('div');
            _d.className='turn arc-open';
            _d.innerHTML='<div class="arc-note">【剧情线 · '+esc(_fired[_i].t)+'】'+esc(_fired[_i].h)+'</div>';
            _fl.appendChild(_d);
          }
          flowScroll();
        }
      }
    }catch(e){}
    /* 记忆 & 日志 */
    pushMemory('['+timeStr()+'] '+text+' → '+(sc.narration||'').slice(0,60));
    addLog(text);
    /* 场景流存档：回主页时可回填 */
    try{ S.gm_memory=S.gm_memory||{}; S.gm_memory.scene_log=S.gm_memory.scene_log||[];
      sc._player=text; sc._ts=timeStr();
      S.gm_memory.scene_log.push(sc);
      if(S.gm_memory.scene_log.length>30) S.gm_memory.scene_log.splice(0,S.gm_memory.scene_log.length-30);
    }catch(e){}
    /* 论坛 / IG 缓存 */
    cacheForum(sc.forum);
    cacheIG(sc.ig);
    /* hook */
    if(sc.hook) showHook(sc.hook);
    /* 数值变动浮层 */
    showDeltas(before, after);
    /* 顶栏刷新 */
    renderTop();
    LAST_SCENE=sc;
    saveGame();
    if(_advN>0) showDayTurn();
    showOptions(sc);
  }catch(e){
    killLoading();
    var m=String(e&&e.message||e);
    if(m==='NOKEY') m='NOKEY 还没有填 API Key。';
    else if(m.indexOf('Failed to fetch')>=0||m.indexOf('NetworkError')>=0) m='网络请求失败：可能是没联网，或浏览器拦截了跨域请求。';
    showError(m);
    showOptions(LAST_SCENE||{options:[]});
  }finally{
    BUSY=false;
  }
}

/* ---------- 数值快照 / 变化浮层 ---------- */
function snapshotNums(){
  if(!S) return null;
  return {a:deepClone(S.attributes||{}), r:deepClone(S.resources||{}), p:(S.social||{})['人气值'], rel:deepClone(S.relationships||{})};
}
function showDeltas(before, after){
  if(!before||!after) return;
  var out=[];
  ['体能','魅力','智力','社交','才艺','心机'].forEach(function(k){
    var d=(after.a[k]||0)-(before.a[k]||0);
    if(d) out.push({n:k, v:d});
  });
  ['体力','精力','心情'].forEach(function(k){
    var d=(after.r[k]||0)-(before.r[k]||0);
    if(d) out.push({n:k, v:d});
  });
  var dp=(after.p||0)-(before.p||0); if(dp) out.push({n:'人气', v:dp});
  var dc=(after.r['现金']||0)-(before.r['现金']||0); if(dc) out.push({n:'现金', v:dc, money:true});
  for(var id in after.rel){
    var d2=(after.rel[id]||0)-(before.rel[id]||0);
    if(d2){
      var c=charById(id);
      var ck=(c&&typeof ckey==='function')?ckey(c.circle):'social';
      out.push({n:(c?c.name.split(' ')[0]:id), v:d2, fav:true, ck:ck});
    }
  }
  if(!out.length) return;
  var box=document.createElement('div'); box.className='deltas';
  var h='';
  out.forEach(function(o){
    var sign=o.v>0?'+':'';
    var cls=o.v>0?'up':'down';
    if(o.fav){
      h+='<span class="dchip '+cls+' c-'+esc(o.ck||'social')+' fav">'
        +'<span class="dchip-heart">❤</span>'
        +'<span class="dchip-name">'+esc(o.n)+'</span>'
        +'<span class="dchip-lab">好感</span>'
        +'<span class="dchip-val">'+sign+o.v+'</span></span>';
    } else {
      h+='<span class="dchip '+cls+'">'+esc(o.n)+' '+sign+(o.money?('$'+o.v):o.v)+'</span>';
    }
  });
  box.innerHTML=h;
  var flow=$('#flow'); if(flow){ flow.appendChild(box); flowScroll(); }
}
