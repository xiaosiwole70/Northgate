  /* 静默落地：主页面不弹黄条，避免打断剧情。仅在用户点开论坛时可见。 */
}

/* ---------- 缓存论坛/IG ---------- */
function cacheForum(arr){ if(!arr||!arr.length) return; S.npc_state=S.npc_state||{}; S.npc_state._forum=arr; }
function cacheIG(arr){ if(!arr||!arr.length) return; S.npc_state=S.npc_state||{};
  for(var i=0;i<arr.length;i++){ try{ if(typeof _igNormPost==='function') _igNormPost(arr[i]); }catch(e){} }
  S.npc_state._ig=arr; }
</script>

<script>
/* ============================================================
   Part 4B : 手机 App / 状态页 / 认识的人 / 存档 / 设置
   ============================================================ */

/* ---------------- 手机 App 路由 ---------------- */
const APPS={ig:'Instagram',forum:'校园论坛',shop:'网购',cal:'日历',music:'音乐',msg:'信息',notif:'通知'};
function openApp(k){
  var wrap=$('#phoneScreen'); if(!wrap) return;
  var body='';
  if(k==='ig') body=renderIG();
  else if(k==='forum') body=renderForum();
  else if(k==='shop') body=renderShop();
  else if(k==='cal') body=renderCal();
  else if(k==='music') body=renderMusic();
  else if(k==='msg') body=renderMessenger();
  else if(k && k.indexOf('chat:')===0) body=renderChat(k.slice(5));
  else if(k && k.indexOf('face:')===0) body=renderFace(k.slice(5));
  else if(k==='notif') body=notifView();
  wrap.innerHTML='<div class="app-h"><button class="app-back" onclick="closeApp()">‹</button>'
    +'<span class="app-t">'+esc(APPS[k]||APPS[String(k).split(':')[0]]||'')+'</span>'
    +'<span class="app-r"></span></div><div class="app-body">'+body+'</div>';
  wrap.classList.add('on');
  /* 渲染后按 App 类型绑定交互 */
  if(k==='ig'){ if(typeof bindIG==='function') bindIG(); }
  else if(k==='forum'){ if(typeof bindForum==='function') bindForum(); }
  else if(k==='shop'){ if(typeof bindShop==='function') bindShop(); }
  else if(k==='music'){ if(typeof bindMusic==='function') bindMusic(); }
  else if(k==='msg'||(k&&k.indexOf('chat:')===0)||(k&&k.indexOf('face:')===0)){ if(typeof bindMessenger==='function') bindMessenger(); }
  if(k==='notif'){
    var nfc=$('#nfClear');
    if(nfc) nfc.onclick=function(){ if(typeof markRead==='function') markRead(); openApp('notif'); };
    if(typeof markRead==='function') markRead();
  }
  if(k!=='notif'&&typeof renderBadges==='function') renderBadges();
  try{ bindEditable(); }catch(e){}
}
function closeApp(){ var w=$('#phoneScreen'); if(w){ w.classList.remove('on'); w.innerHTML=''; } if(typeof _MSG_OPEN!=='undefined') _MSG_OPEN.cur=null; if(typeof _FACE_OPEN!=='undefined') _FACE_OPEN.cur=null; }

/* ---------------- 世界日推（世界先于主角运转） ----------------
   每推进一天（advanceDay 末尾调用）就：
   ①让 IG 动态池自己“长”一点（无需玩家打开 IG）；
   ②按人设/好感/剧情，让联系人“主动”发来一条私信。
   人设驱动：消息内容取该角色自己的圈层口吻（_npcTextFor），
   不是全员共用一批通用句；关系越冷越可能不回、不回就是人设。 */
function worldDayTick(){
  if(!S || typeof igWorldTick!=='function') return;
  /* ① 世界动态：推进日也能长新帖（igWorldTick 内部按周幂等，安全重复调用） */
  var dyn=(S.npc_state&&S.npc_state._ig)||[];
  try{ igWorldTick(dyn); }catch(e){}
  /* ② NPC 主动私信 */
  try{ npcProactiveDM(); }catch(e){}
}
/* 一条“主动私信”文本：优先用角色自己的圈层口吻池，拼出短句 */
function _proactiveLine(c,seed){
  var v=(S.relationships&&S.relationships[c.id])||0;
  var t=favTier(v);
  /* 关系越冷，越可能只是敷衍地戳一下，甚至不发（由调用方决定概率） */
  var pool=_IG_TXT_BY_CIRCLE[c.circle]||_IG_TXT;
  var core=_igEn(_pick(pool, seed||('dm'+c.id)));
  /* 按亲密度改口吻：熟的人会加称呼/尾巴，不熟的人保持短 */
  if(t==='hi'){ var tails=['，在吗','，你今晚有空吗','，刚想到你','','，别装死'];
    return String(core).replace(/[。!！~～]*$/,'')+_pick(tails,(seed||'')+'t'); }
  if(t==='mid'){ return core; }
  /* 初见/关系浅：也别只丢一个“……”让人尴尬，用一句正常的开场 */
  if(_isFirstMeet(c,c.id)){ return _pick(['在吗','有空吗','问个事','对了','那个'],(seed||'')+'f'); }
  return _pick(['在吗','问个事','……','那个','有空吗'],(seed||'')+'m');
}
/* 让联系人按人设/好感/剧情，主动发来私信（不依赖玩家先开口） */
function npcProactiveDM(){
  if(!S) return;
  var met=(S.meet_log||{});
  var frs=[];
  for(var id in met){
    if(!met[id] || !met[id].length) continue;
    var c=charById(id); if(!c) continue;
    frs.push({ c:c, v:(S.relationships&&S.relationships[id]!=null)? S.relationships[id]:0 });
  }
  if(!frs.length) return;
  frs.sort(function(a,b){ return b.v-a.v; });
  var wk=(S.schedule&&S.schedule.week)||1, dy=(S.schedule&&S.schedule.day)||0;
  /* 每天至多一条主动私信（用 flag 去重，避免同一天刷屏） */
  var stamp=timeStr();
  S.chat=S.chat||{};
  if(S.npc_state._lastDM===stamp) return;
  /* 好感越高越可能主动找你；剧情 hook（gm_memory 最近主题）会加权 */
  var drama=(function(){ try{ var m=S.gm_memory&&S.gm_memory.recent&&S.gm_memory.recent[0]; return m? 1:0; }catch(e){ return 0; } })();
  for(var i=0;i<frs.length && i<4;i++){
    var o=frs[i], c=o.c, v=o.v;
    var seedVal=_seedHash('dm'+c.id+wk+dy+stamp);
    var p=(typeof _rand==='function')?_rand(seedVal):0;
    /* 概率：很熟 0.55 / 一般 0.30 / 不太熟 0.15 / 冷 0.06；有剧情时 +0.15 */
    var chance=(v>=60?0.55 : v>=20?0.30 : v>=0?0.15 : 0.06)+drama*0.15;
    if(p>=chance) continue;
    /* 先占住今天的名额（无论走 AI 还是本地池，都只发一条） */
    S.npc_state._lastDM=stamp;
    /* 有 Key → 优先用 AI 现场生成（更贴合人设与当下剧情）；失败/无 Key → 本地圈层池兜底 */
    if(typeof hasKey==='function' && hasKey() && typeof callAI==='function'){
      _aiProactiveDM(c, seedVal, stamp);
    }else{
      _deliverDM(c, _proactiveLine(c, seedVal+'x'), _maybePic(seedVal), stamp);
    }
    break;   /* 一天一条，够了 */
  }
}
/* 是否给这条私信配图（约 1/5，复用私信发图规范） */
function _maybePic(seedVal){
  if((typeof _ri!=='function')) return '';
  if(_ri(0,4,seedVal+'i')!==0) return '';
  return (typeof _pick==='function')? _igEn(_pick(_IG_PIC, seedVal+'p')) : '';
}
/* 把一条 NPC 私信入档 + 通知（AI 与本地池共用同一落库规范） */
function _deliverDM(c, txt, pic, stamp){
  if(!S||!c) return;
  stamp=stamp||timeStr();
  var msgs=chatOf(c.id);
  var _nm={ me:false, t:String(txt||''), time:stamp };
  if(pic) _nm.img=pic;
  msgs.push(_nm);
  if(msgs.length>60) msgs.splice(0, msgs.length-60);
  if(typeof pushNotif==='function'){
    pushNotif({ app:'msg', title:cnName(c), body:(_nm.t||(pic?'［图片］':'…')) });
  }
  try{ if(typeof saveGame==='function') saveGame(); }catch(e){}
  /* 若玩家此刻正开着跟这个人的聊天窗，实时刷新出来 */
  try{
    if(typeof _MSG_OPEN!=='undefined' && _MSG_OPEN.cur===c.id && typeof openApp==='function') openApp('chat:'+c.id);
  }catch(e){}
}
/* AI 级主动私信：结合人设 + 好感 + 当下剧情/星期/天气，让 NPC“自己想”一条消息发过来 */
function _aiProactiveDM(c, seedVal, stamp){
  if(!S||!c) return;
  var wk=(S.schedule&&S.schedule.week)||1, dy=(S.schedule&&S.schedule.day)||0;
  var dayName=(typeof DAYS!=='undefined' && DAYS[dy%7])||'';
  var wx=null; try{ wx=weatherNow(); }catch(e){}
  /* 最近聊天（若聊过），帮助 AI 接住上下文 */
  var hist=(S.chat&&S.chat[c.id])? S.chat[c.id]:[];
  var recent=hist.slice(-4).map(function(m){ return (m.me?'我：':'你：')+(m.t||(m.img?'［图片］':'')); }).join('\n');
  /* 剧情线索：gm_memory 的最近主题 + 未揭晓悬念，作为“主动开口”的由头 */
  var hook='';
  try{
    var rec=S.gm_memory&&S.gm_memory.recent;
    if(rec&&rec.length) hook=String(rec[0].t||rec[0]||'').slice(0,60);
  }catch(e){}
  var brief=(typeof msgPersona==='function')? msgPersona(c, c.id):'';
  var sys=brief+'\n\n【这次是“你主动”给主角发私信】（不是回复，是你自己先开口）。'
    +'\n主动发私信要有由头：可能是想起一件事、看到某样东西、想约人、还是就想说句话——符合你的人设和你们的关系。'
    +'\n如果你们不熟，你只会很简短地戳一下（甚至只发一个问号），别热情过头。'
    +'\n当下时间：'+(typeof timeStr==='function'?timeStr():'')+(dayName?'（'+dayName+'）':'')
    +(wx? '；天气：'+wx.txt : '')
    +(hook? '\n最近你俩之间/校园里的事：'+hook : '')
    +(recent? '\n【你俩最近聊过】\n'+recent : '')
    +'\n\n只输出你要主动发出去的那条消息本身。';
  var iv=setTimeout(function(){   /* 超时兜底：AI 太慢就先发本地池的，别让玩家干等 */
    _deliverDM(c, _proactiveLine(c, seedVal+'x'), _maybePic(seedVal), stamp);
  }, 12000);
  callAI([{role:'system',content:sys}], false).then(function(r){
    if(iv) clearTimeout(iv);
    var txt=(r&&String(r).trim())? String(r).trim():'';
    if(!txt){ _deliverDM(c, _proactiveLine(c, seedVal+'x'), _maybePic(seedVal), stamp); return; }
    txt=txt.replace(/^[“"'‘]+/,'').replace(/[”"'’]+$/,'').trim();
    txt=txt.replace(/^[\s\S]{0,2}[:：]\s*/,'');
    var _pz=(typeof parseImgTag==='function')? parseImgTag(txt) : {t:txt,img:''};
    var body=_pz.t; if(body.length>60) body=body.slice(0,60);
    var img=_pz.img||_maybePic(seedVal); if(img.length>46) img=img.slice(0,46);
    _deliverDM(c, body, img, stamp);
  }).catch(function(){
    if(iv) clearTimeout(iv);
    _deliverDM(c, _proactiveLine(c, seedVal+'x'), _maybePic(seedVal), stamp);
  });
}

/* ---------------- Instagram ---------------- */
function igFriends(){
  /* IG 只展示“已结识”的人（meet_log 为准），未结识的不出现在 IG 里 */
  var out=[];
  var met=(S.meet_log||{});
  for(var id in met){
    if(!met[id] || !met[id].length) continue;
    var c=charById(id); if(!c) continue;
    var v=(S.relationships&&S.relationships[id]!=null)? S.relationships[id] : 0;
    out.push({c:c,v:v});
  }
  out.sort(function(a,b){return b.v-a.v;});
  return out;
}
function renderIG(){
  var dyn=(S.npc_state&&S.npc_state._ig)||[];
  var frs=igFriends();
  /* 世界先于主角运转：每次进 IG，让动态池自己“长”一点 */
  igWorldTick(dyn);
  var h='';
  h+='<div class="ig-sep"><span>动态</span></div>';
  h+='<div class="ig-feed">';
  if(!dyn.length){
    h+='<div class="empty">还没有新的动态。<br><span class="dim">推进剧情后，这里会出现你认识的人的 IG。</span></div>';
  }else{
    dyn.forEach(function(d,i){
      var cmts=Array.isArray(d.comments)? d.comments : [];
      var who=CHARS.find(function(c){ return c.name===d.user || c.cn===d.user; }) || _findByName(d.user);
      var ck=who? ckey(who.circle) : 'social';
      var ckName=who? String(who.circle||'社交圈') : '社交圈';
      var isMe=(d.user==='我'||d.mine);
      h+='<div class="ig-card c-'+ck+(d._new?' mine-glow':'')+'" data-igcard="'+i+'">'
        +'<div class="ig-ch">'
        +(isMe? '<div class="ig-av c-me"><span>我</span></div>'
              : igAvatar(d.user, ck))
        +'<div class="ig-nm"><span class="ig-u">'+esc(dispName(d.user))
        +(isMe? '' : (function(){var mk=who?verifyMark(who):null; return mk? ' <i class="ig-vf v-'+mk.k+'" title="'+mk.n+'">✓</i>':'';})())
        +'</span><span class="ig-sub">'+esc(d.t||('第'+(S.schedule.day!=null?S.schedule.day:1)+'天'))+'</span></div>'+(isMe? '<button class="ig-del" data-igdel="'+i+'" title="删除这条动态">删除</button>':'')+'</div>'
        +'<div class="ig-tx">'+esc(d.text||'')+'</div>'
        +(d._polish? '<div class="ig-polishing">✨ 正在润色这张照片的描述…</div>' : '')+(d.img? '<div class="ig-photo c-'+ck+'"><span class="ig-pic-tag">配图：</span>（'+esc(_igEn(d.img))+'）</div>' : '')
        +'<div class="ig-bar"><span class="ig-like'+(d.liked?' on':'')+'" data-ig="'+i+'">'+(d.liked?'❤':'♡')+' '+esc(d.likes||0)+'</span>'
        +'<span class="ig-cm" data-igcm="'+i+'">💬 '+(cmts.length? cmts.length+' 条评论':'评论')+'</span></div>'
        +'<div class="ig-cbox" id="igc-'+i+'" style="display:none">';
      if(cmts.length){
        cmts.forEach(function(c2){
h+='<div class="ig-cl" data-igcidx="'+i+':'+cmts.indexOf(c2)+'"><b>'+esc(dispName(c2.u||c2.user||'匿名'))+'</b> '+esc(c2.text||c2.t||'')
            +'<span class="ig-cdel">删除</span></div>';
        });
      }else{
        h+='<div class="ig-cl dim">还没有人评论。</div>';
      }
      h+='<div class="ig-crow"><input class="ig-cin" id="igcin-'+i+'" placeholder="写条评论…"><button class="ig-cgo" data-igcgo="'+i+'">发送</button></div>';
      h+='</div></div>';
    });
  }
  h+='</div>';
    dyn.forEach(function(d){ if(d&&d._new) delete d._new; });
  h+='<div class="ig-hint">📸 拍照：可配文案，也可「只发图、不加文案」；纯文字直接输入按“发布”。</div>';
  h+='<div class="ig-post">'
    +'<input id="myPost" class="free-in" placeholder="写点什么…（可直接发布）">'
    +'<button class="free-go" id="postCam" title="拍照发帖">📸</button>'
    +'<button class="free-go" id="postGo">发布</button></div>';
  return h;
}

function bindIG(){
  /* 删除我的帖子 */
  $$('#phoneScreen .ig-del').forEach(function(el){
    el.onclick=function(ev){
      if(ev&&ev.stopPropagation) ev.stopPropagation();
      var i=+el.dataset.igdel;
      if(!window.confirm('删除这条动态？删了就找不回来了。')) return;
      igDeletePost(i);
    };
  });
  /* 评论：长按可删（自己的评论 / 自己帖子下的评论） */
  $$('#phoneScreen .ig-cl').forEach(function(el){
    var pi=(el.dataset.igcidx!=null)? +String(el.dataset.igcidx).split(':')[0] : -1;
    var ci=(el.dataset.igcidx!=null)? +String(el.dataset.igcidx).split(':')[1] : -1;
    if(pi<0||ci<0) return;
    var tm=null;
    var arm=function(){
      tm=setTimeout(function(){ el.classList.add('show-del'); }, 480);
    };
    var dis=function(){ if(tm) clearTimeout(tm); };
    el.addEventListener('touchstart', arm, {passive:true});
    el.addEventListener('touchend', dis, {passive:true});
    el.addEventListener('touchcancel', dis, {passive:true});
    el.addEventListener('mousedown', arm);
    el.addEventListener('mouseup', dis);
    el.addEventListener('mouseleave', dis);
    el.addEventListener('click', function(ev){
      var tgt=ev.target;
      if(tgt && tgt.className && String(tgt.className).indexOf('ig-cdel')>=0){
        ev.stopPropagation();
        if(!window.confirm('删除这条评论？')) return;
        igDeleteComment(pi, ci);
      }
    });
  });
  $$('#phoneScreen .ig-like').forEach(function(el){
    el.onclick=function(){
      var i=+el.dataset.ig;
      igOnLike(i);
      var d=((S.npc_state&&S.npc_state._ig)||[])[i]||{};
      el.classList.toggle('on',!!d.liked);
      el.textContent=(d.liked?'❤ ':'♡ ')+(d.likes||0);
      toast(d.liked?'已点赞':'已取消');
      saveGame();
    };
  });
  /* 展开/收起评论区 */
  $$('#phoneScreen .ig-cm').forEach(function(el){
    el.onclick=function(){
      var i=+el.dataset.igcm;
      var box=$('#igc-'+i);
      if(box) box.style.display=(box.style.display==='none')? 'block':'none';
    };
  });
  /* 发表评论：走 igOnComment（含楼主/路人回评 + 通知） */
  $$('#phoneScreen .ig-cgo').forEach(function(el){
    el.onclick=function(){
      var i=+el.dataset.igcgo;
      var inp=$('#igcin-'+i);
      var v=inp? inp.value.trim():'';
      if(!v) return;
      var dyn=(S.npc_state&&S.npc_state._ig)||[];
      var d=dyn[i]; if(!d) return;
      var before=Array.isArray(d.comments)?d.comments.length:0;
      igOnComment(i,v);
      /* 被评论者好感 +1（已结识才有意义） */
      var who=CHARS.find(function(c){ return c.name===d.user||c.cn===d.user; });
      if(who && S.relationships && S.relationships[who.id]!=null){
        S.relationships[who.id]=Math.min(100,(S.relationships[who.id]|0)+1);
      }
      saveGame();
      inp.value='';
      /* 局部重绘评论区（含新回评） */
      var box=$('#igc-'+i);
      if(box){
        var cmts=d.comments||[];
        var row=box.querySelector('.ig-crow');
        box.innerHTML='';
        var postMine0=(d.mine||d.user==='我');
        cmts.forEach(function(c2,ci2){
          var line=document.createElement('div');
          line.className='ig-cl';
          var cme0=(c2.u==='我'||c2.me||c2.mine);
          line.setAttribute('data-igcidx', i+':'+ci2);
          var cdel0=(postMine0||cme0)? '<span class="ig-cdel">删除</span>' : '';
          line.innerHTML='<b>'+esc(c2.me?'我':dispName(c2.u||c2.user||'匿名'))+'</b> '+esc(c2.t||c2.text||'')+cdel0;
          box.appendChild(line);
        });
        var nr=document.createElement('div');
        nr.className='ig-crow';
        nr.innerHTML='<input class="ig-cin" id="igcin-'+i+'" placeholder="写条评论…"><button class="ig-cgo" data-igcgo="'+i+'">发送</button>';
        box.appendChild(nr);
        bindIG(); /* 重绘后重新绑定新按钮 */
      }
      var cm=$('#phoneScreen .ig-cm[data-igcm="'+i+'"]');
      if(cm){ var n=(d.comments||[]).length; cm.textContent='💬 '+(n?n+' 条评论':'评论'); }
      toast('已评论');
    };
  });
  /* 发帖：纯文字（无图） */
  var pg=$('#postGo');
  if(pg) pg.onclick=function(){
    var inp=$('#myPost');
    var raw=inp? inp.value.trim():'';
    if(!raw) return;
    var pz=parsePostImg(raw);
    var v=pz.t;
    if(!v){ toast('先写点配文吧'); return; }
    igMyPostAdd(v,'');
    if(inp) inp.value='';
    igRefreshFeed();
    toast('已发布到你的 IG');
    saveGame();
    if(typeof sendAction==='function') sendAction('（我在 Instagram 发了一条动态：\"'+v+'\"）');
  };
  /* 发帖：拍照（文字描述 → 配图:xx）+ 配文，发送前 AI 润色图片描述 */
  var pc=$('#postCam');
  if(pc) pc.onclick=function(){
    var inp=$('#myPost');
    var cap=inp? inp.value.trim():'';
    /* 需求③：支持「只发图、不加文案」——无文案时二次确认后继续 */
    if(!cap){
      var ok=window.confirm('没有写配文，只发照片？（确定 = 只发图 / 取消 = 返回补配文）');
      if(!ok){ toast('好，补一句再发～'); return; }
      cap='';
    }
    var shot=window.prompt('拍照：描述你镜头里拍到的东西（这就是照片内容）\n例：操场夕阳下橄榄球队训练的远景', '');
    if(shot===null) return;
    shot=String(shot).trim();
    if(!shot){ toast('没拍到东西就不算照片啦'); return; }
    /* 先占位发布（图片描显示“润色中…”），随后 AI 润色 */

    if(inp) inp.value='';

/* ---- 发帖配图：从自由文本里抽出 [[图:描述]] / 配图:xx 标记 ---- */
function parsePostImg(raw){
  var t=String(raw||'');
  var img='';
  var m=t.match(/\[\[\s*\u56fe\s*[:：]\s*([\s\S]*?)\s*\]\]/);
  if(m){
    img=String(m[1]).trim();
    t=t.replace(m[0],' ');
  }else{
    /* 兜底：“配图:描述”写法——只吞到分隔符（两个空格 / | / ｜ / 换行）为止 */
    var m2=t.match(/\u914d\u56fe\s*[:：]\s*([^\n|\uff5c]+?)(?:\s{2,}|\s*[|\uff5c]\s*|$)/);
    if(m2){
      img=String(m2[1]).trim();
      t=t.replace(m2[0],' ');
    }
  }
  if(img.length>46) img=img.slice(0,46);
  t=t.replace(/\s+/g,' ').trim();
  if(t.length>90) t=t.slice(0,90);
  return {t:t, img:img};
}

/* ---- 本地“润色”兑底（无 Key / 请求失败时使用）---- */
function _polishLocalChunk(t){
  t=String(t||'').replace(/\s+/g,' ').trim();
  if(!t) return '';
  var seeds=['光线正好','随手一拍','角度很绝','氛围拉满','就这么一下','画面里很安静','看着就有点心动','细节很杀','定格住了','就那样随手定的'];
  var h=0; for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  var lead=t;
  lead=lead.replace(/^(我拍|拍到|拍的|拍下)/,'');
  lead=lead.replace(/[。！，,、]+$/,'');
  if(!/^(一|这|那|整|半|两|三|几|阳光|夕阳|夜色|镜头|画面|课桌|球场|食堂|教室|走廊|操场|停车|朋友|人群|琴|球|笔记|咖啡|天空|云)/.test(lead)) lead='镜头里的'+lead;
  var r=lead+'，'+seeds[h%seeds.length];
  if(r.length>44) r=r.slice(0,44);
  return r;
}
/* ---- AI 润色帖子配图描述（失败降级本地）---- */
async function igPolishPost(i, cb){
  var d=igPostAt(i);
  if(!d){ if(cb) cb(); return; }
  var raw=String(d.img||'').trim();
  var cap=String(d.text||'').trim();
  d._polish=true;
  if(typeof igRefreshFeed==='function') igRefreshFeed();
  if(!hasKey()){
    if(raw){ d.img=_polishLocalChunk(raw); }
    d._polish=false;
    if(typeof saveGame==='function') saveGame();
    if(typeof igRefreshFeed==='function') igRefreshFeed();
    if(cb) cb(); return;
  }
  try{
    var sys='你是 Northgate High 的学生，在给刚发布的 Instagram 动态润色配图描述。要求：只输出一句自然好读的中文画面描述（像随手拍的真实手机照片），不要引号、不要开头前缀（如“图片：”）、不要标签，一句话，不超过 44 字。';
    var usr='配文：'+(cap||'（无配文）')+'\n原始画面：'+(raw||'（未描述，请根据配文想象一张合理照片）');
    var out=await callAI([{role:'system',content:sys},{role:'user',content:usr}], false);
    var polish=String(out||'').replace(/[\r\n]+/g,' ').replace(/^[“”「」]+|[“”「」]+$/g,'').trim();
    if(polish.length>46) polish=polish.slice(0,46);
    if(polish){ d.img=polish; }
    else if(raw){ d.img=_polishLocalChunk(raw); }
  }catch(e){
    if(raw) d.img=_polishLocalChunk(raw);
  }
  d._polish=false;
  if(typeof saveGame==='function') saveGame();
  if(typeof igRefreshFeed==='function') igRefreshFeed();
  if(cb) cb();
}
/* ---- 发布前润色 → 返回 {t, img} ---- */
async function igPolishDraft(cap, img){
  cap=String(cap||'').trim();
  img=String(img||'').trim();
  var sys='你是 Northgate High 的学生，在准备发一条 Instagram。把这张照片用一句自然好读的中文画面描述出来（像随手拍的真实手机照片）：不要引号、不要前缀（如“图片：”）、不要标签，一句话，不超过 44 字。';

/* —— 确定性伪随机（同周同人结果稳定，跨周才变化）—— */
function _seedHash(str){
  var h=2166136261>>>0;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h*16777619)>>>0; }
  return h;
}
function _rand(seed){ /* 0~1 之间，稳定 */
  var x=_seedHash(String(seed));
  x^=x<<13; x>>>=0; x^=x>>17; x>>>=0; x^=x<<5; x>>>=0;
  return (x>>>0)/4294967296;
}
function _pick(arr, seed){ if(!arr||!arr.length) return null; return arr[Math.floor(_rand(seed)*arr.length)%arr.length]; }
function _ri(lo,hi,seed){ return lo+Math.floor(_rand(seed)*(hi-lo+1)); }

/* —— 认证标记：名人 / 校队 / 学生会 —— */
function verifyMark(c){

  if(c.circle==='体育圈' || c.power==='Varsity校队')   return {k:'gold', t:'✓', n:'校队'};
  if(c.power==='学生会' || c.circle==='学术圈')        return {k:'gray', t:'✓', n:'学生组织'};
  return null;
}

  var w=(S.schedule&&S.schedule.year&&S.schedule.week)? S.schedule.week : 1;
  var season=(typeof seasonOf==='function')? (seasonOf(w).n||'') : '';
  var _ac=(typeof activeCircles==='function')? activeCircles(w) : null;
  var act=(_ac && Array.isArray(_ac.now))? _ac.now : (Array.isArray(_ac)? _ac : []);
  var pool=[];
  /* 剧情 hook 优先（gm_memory 最近一条主题，但转成“话题”口吻） */
  var base=[
    '#开学第一周', '#北区vs南区', '#Homecoming预热', '#Pep Rally倒计时',
    '#Varsity选拔', '#食堂三楼到底谁的', '#GPA生存指南', '#谁的车最贵',
    '#泳池趴还是车库趴', '#新来的转学生'
  ];
  (act||[]).forEach(function(cc){ pool.push('#'+cc+'风向'); });
  pool=pool.concat(base);
  if(season==='冬') pool.unshift('#期末周', '#冬令热可可');
  if(season==='春') pool.unshift('#Prom人选', '#春假计划');
  if(season==='夏') pool.unshift('#毕业季', '#暑假去哪');
  if(season==='秋') pool.unshift('#赛季开始', '#新学期立flag');

  for(var i=0;i<pool.length && out.length<5;i++){
    var t=pool[i];
    if(seen[t]) continue; seen[t]=1; out.push(t);

}

/* Fix2：判断一段 [[图:...]] 描述其实是「旁白式场景描写」而非真实图片。
   特征：以（ 开头 / 含"场景/画面/气氛/窗外/墙上/空气/远处"等环境词，且不像"某某的一张照片"。
   命中则不进气泡，改为独立场景块 scene-note。 */
function _isSceneNar(t){
  t=String(t||'').trim();
  if(!t) return false;
  if(/^[（(]/.test(t)) return true;
  var env=/场景|画面|气氛|窗外|墙上|空气|远处|走廊|楼梯|教室|食堂|操场|图书馆|路边|天空|阳光|树影|灯光|人群|背影|角落|门口|台上|台下/;
  var photo=/一张照片|自拍|截图|特写|合影|照片/;
  if(env.test(t) && !photo.test(t)) return true;
  return false;
}
function sceneNoteHTML(txt){
  return '<div class="scene-note">'+esc(String(txt||'').replace(/^[（(]|[）)]$/g,''))+'</div>';
}
/* Fix：把回复文本里「成对的（动作/环境描写）」拆出来单独成块，避免塞进对话气泡。
   注意：本函数名不可与「叙事切分」的 _splitNarr 重名（后者返回数组 parts）。 */
function _splitBubbleNarr(raw){
  var s=String(raw==null?'':raw);
  var nars=[], speech=s;
  var re=/[（(]([^（()）]{2,60})[）)]/g, m;
  while((m=re.exec(s))!==null){
    if(nars.length>=2) break;
    var inner=String(m[1]).trim();
    if(!inner) continue;
    if(/[“”"']/.test(inner)) continue;
    nars.push(inner);
    speech=speech.replace(m[0],' ');
  }
  speech=speech.replace(/\s+/g,' ').trim();
  return { narr:nars, speech:speech };
}

/* 统一私信时间戳（day 从 0 起 → 展示时至少为第1天；可在同一条消息对里冻结复用） */
function chatStamp(){ var d=(S&&S.schedule&&S.schedule.day!=null)?S.schedule.day:1; return '第'+(d<1?1:d)+'天'; }
/* 解析 NPC 消息中的图片标记 [[图:xxx]] → {t:文本, img:图片描述}。图片描述为纯文字。 */
function parseImgTag(raw){
  var t=raw==null? '': String(raw);
  var img='';
  var m=t.match(/\[\[\s*图\s*[:：]\s*([\s\S]*?)\s*\]\]/);
  if(m){ img=String(m[1]).trim(); t=t.replace(m[0],' '); }
  t=t.replace(/\s+/g,' ').trim();
  return {t:t, img:img};
}

  if(!c) return '<div class="empty">找不到这个人。</div>';
  var msgs=faceOf(id);
  var h='<div class="ch-head">'
    + '<span class="ch-name">'+esc('面对面 · '+cnName(c))+'</span>'
    + '<span class="ch-sub">'+esc((c.circle||'')+' · '+(c.power||''))+'</span>'
    + '<button class="ch-profile" id="chProfile" data-cid="'+id+'">档案</button>'
    + '</div>';
  h+='<div class="ch-body" id="chBody">';
  if(!msgs.length){
    h+='<div class="ch-tip">你走到 '+esc(cnName(c))+' 面前。说点什么。</div>';
  }else{
    msgs.forEach(function(m){
      var _mp=(typeof _splitBubbleNarr==='function'&&m.t)? _splitBubbleNarr(m.t) : {narr:[],speech:(m.t||'')};
      h+='<div class="ch-row '+(m.me?'me':'you')+'">'
        +((m.img&&!_isSceneNar(m.img))? '<div class="ch-photo"><span class="ch-pic-tag">📷 图片：</span>（'+esc(m.img)+'）</div>' : '')
        +((m.img&&_isSceneNar(m.img))? sceneNoteHTML(m.img) : '')
        +(_mp.speech? '<div class="ch-bub">'+esc(_mp.speech)+'</div>' : '')
        +(_mp.narr||[]).map(function(x){ return sceneNoteHTML(x); }).join('')
        +'<div class="ch-time">'+esc(m.time||chatStamp())+'</div>'
        +'</div>';
    });
  }
  if(_FACE_OPEN.typing){
    h+='<div class="ch-row you"><div class="ch-bub typing"><i></i><i></i><i></i></div></div>';
  }
  h+='</div>';
  h+='<div class="ch-inbar"><input id="chInput" class="ch-input" placeholder="开口说…" data-cid="'+id+'" data-face="1">'
    +'<button class="ch-send" id="chSend" data-cid="'+id+'" data-face="1">说</button></div>';
  return h;
}
/* 本地兜底回复（AI 不可用时） */
/* ============================================================
   人设对话引擎 —— 双场景
   msgPersona  : 消息私信（DM）——短、碎、可已读不回
   facePersona : 面对面搭话  ——现场感、动作神态、可被打断
   共享：好感分档 + 负向清单（禁客服腔/总结腔/说教腔）
   ============================================================ */
function favTier(v){
  if(v>=60) return 'hi';
  if(v>=20) return 'mid';
  if(v>=0)  return 'low';
  return 'cold';
}
function _negList(){
  return '禁止出现的腔调：客服腔（“有什么可以帮你的”“我理解你的感受”）、'
    +'总结腔（“总的来说”“首先…其次…”）、说教腔（“你应该…”“作为…我认为”）、'
    +'AI 自指、书面语、“作为一个/一名…”。';
}
/* 是不是「还没真正打过交道」——刚认识/第一次说话 */
function _isFirstMeet(c,id){
  if(!c) return true;
  var v=(S.relationships&&S.relationships[id])||0;
  var log=(S.meet_log&&S.meet_log[id])||[];
  return !(log&&log.length>1) || v<=0;
}
function _tierRule(t, first){
  /* 初见原则：不许一上来就让人难堪。生疏 ≠ 冷淡，可以礼貌、观望、带点好奇。 */
  if(first){
    return '你们刚认识、还没真正打过交道：按 TA 的人设可以「观察/保留/客气/试探」，'
      +'但不要一上来就冷脸、敷衍、嘲讽或让人难堪。礼貌中带一点距离感即可，'
      +'至少给出一句完整的话，别用“嗯”“？”“……”直接把人晾在那儿。';
  }
  if(t==='hi')   return '对方跟你很熟：语气放松热络，可以有玩笑、梗、emoji。';
  if(t==='mid')  return '你们还算聊得来：语气自然随意，不用太热情也不用太冷。';
  if(t==='low')  return '你们交情一般：语气客气、话不多，但不是敌意——可以简短、可以忙，仍愿意正常回应。';
  return '你们之间有过不愉快：可以有距离、话里带刺或不耐烦，但仍按人设保留分寸，别写成纯粹恶意的刁难。';
}

    '圈子：'+(c.circle||'')+'；校园地位：'+(c.power||'')+'。',
    '你和发消息的人（主角）好感度：'+v+'。'+_tierRule(t, _isFirstMeet(c,id)),
    '这是「发私信」不是面对面：像真人打字那样，短、碎、口语化。',
    '常见就一条，最多两条；尽量不超过 15 个字；可以只回一个字、一个问号、一串省略号，甚至不回（只输出一个“”之外的字也行）。',

    '发图时可只发图（整条只有一个 [[图:...]]），也可图配一句短话（如“看这个[[图:球衣挂衣柜里]]”）。画面要符合你的人设、圈子和当下话题；描述不超过 20 字。不要滥用，绝大多数时候还是纯文字。',

/* ---- 面对面（现实搭话）---- */
function facePersona(c,id){
  var who=cnName(c);
  var v=(S.relationships&&S.relationships[id])||0;

  return [

    _negList(),
    '只输出这一回合对方的表现（动作 + 台词，可含 [[图:...]] 标记）。'
  ].join('\n');

function _fallbackReply(c,arr){
  var v=(S.relationships&&S.relationships[c.id])||0;
  var hi=['哈哈好啊！','你这么说我就懂了','那必须的','笑死我了','晚点再聊，我在忙'],
      lo=['嗯。','有事？','……','不太想聊这个'],
      mid=['哦哦这样啊','？','然后呢','说来听听'];
  var pool = v>=60?hi : (v<0?lo:mid);
  /* 初见不吃冷脸池：即使数值低，也先用中性回应，别让人难堪 */
  if(_isFirstMeet(c,c.id)) pool=mid;
  return pool[Math.floor(Math.abs(_seedHash(c.id+(arr.length)))%pool.length)];
}

function bindMessenger(){
  $$('#phoneScreen .ms-it').forEach(function(el){
    el.onclick=function(){ _MSG_OPEN.cur=el.dataset.msopen; openApp('chat:'+el.dataset.msopen); };
  });
  var pf=$('#chProfile');
  if(pf) pf.onclick=function(){
    closeApp(); go('home');
    sendAction('（我点开了 '+cnName(charById(pf.dataset.cid))+' 的社媒档案，看了起来。）');
  };
  var sd=$('#chSend');
  if(sd){
    function doSend(){
      var inp=$('#chInput');
      var v=inp? inp.value.trim():'';
      if(!v) return;
      if(inp) inp.value='';   /* Fix1：发出即清空输入框，避免残留 */
      if(sd.dataset.face) sendFace(sd.dataset.cid, v);
      else sendMsg(sd.dataset.cid, v);
    }
    sd.onclick=doSend;
    var inp2=$('#chInput');
    if(inp2) inp2.onkeydown=function(e){ if(e.key==='Enter') doSend(); };
  }
  /* 滚到底部 */
  var body=$('#chBody');
  if(body) body.scrollTop=body.scrollHeight;
}

/* NPC 文案自动化 —— 随机补 emoji 尾缀，更像真人发 IG。统一输出中文。 */
function _npcTextTail(pair,seed){ var zh=_poolZh(pair);
  zh=String(zh||'');
  /* 已有 emoji 就不硬加；没有则随机尾缀 */
  var has=/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(zh);
  if(!has) zh=zh+' '+_pick(_IG_EMO, (seed||'e')+'a');
  /* 偶尔双 emoji，增强活人感 */
  else if(_ri(0,3,(seed||'e')+'b')===0) zh=zh+' '+_pick(_IG_EMO,(seed||'e')+'c');
  return zh; }

/* ---- 统一归一：任意形态帖子文案 → 中文主显 ----
   支持：[英文,中文] 数组 / {text,zh} 对象 / 纯字符串（旧存档）。
   一律收敛为中文文本（d.text 直接存放中文）。 */
function _igEn(x){
  /* 池为 [英文, 中文] 成对；动态已改为纯中文，数组统一取中文 [1] */
  if(Array.isArray(x)) return String(x[1]==null?'':x[1]);
  if(x && typeof x==='object') return String(x.text==null?'':x.text);
  return String(x==null?'':x);
}
/* 归一一条帖子记录，就地写入标准字段（text=中文主显） */
function _igNormPost(d){
  if(!d || typeof d!=='object') return d;
  var zh='';
  if(Array.isArray(d.text)) zh=String(d.text[1]==null?'':d.text[1]);
  else if(d.text && typeof d.text==='object') zh=String(d.text.zh==null?(d.text.text==null?'':d.text.text):d.text.zh);
  else zh=d.zh==null?String(d.text==null?'':d.text):String(d.zh);
  d.text=zh;
  delete d.zh;
  return d;
}

function igWorldTick(dyn){
  if(!Array.isArray(dyn)) return;
  var wk=S.schedule&&S.schedule.week||1;
  var frs=igFriends();
  if(!frs.length) return;
  /* 每条旧动态：按“周”推进一次互动（幂等，用 _tick 标记） */
  dyn.forEach(function(d,i){
    if(!d||d.user==='我'||d.mine) return;
    if(d._tick===wk) return;
    d._tick=wk;
    var s=_seedHash('ig'+i+wk+d.user);
    d.likes=Math.max(0,(d.likes||0)+_ri(0,9,s));
    d.comments=Array.isArray(d.comments)?d.comments:[];
    /* NPC 帖评论区：只挑有信息量的回应；接不上就不评论（不再硬凑口水） */
    var n=_ri(0,1,s^0x9e37);
    /* 评论者候选：必须排除本条帖子的作者（避免楼主评自己的帖） */
    var cands=frs.filter(function(o){ return (o.c&&o.c.name)!==d.user && (o.c&&o.c.id)!==d.user; });
    for(var k=0;k<n && cands.length;k++){
      var f=_pick(cands,s+k*131).c;
      var rl=_igCmt(_igReplyTo(d.text||d.content||'', d.circle||'', f.name, s+k*77), f.name);
      if(rl && f.name!==d.user) d.comments.push(rl);
    }
    /* 主角发的动态被点赞/评论 → 通知 */
    if((d.user==='我'||d.mine) && n>0 && typeof pushNotif==='function'){
      var _lastC=d.comments[d.comments.length-1];
      pushNotif({app:'ig',title:_lastC.u+' 评论了你的动态',
        body:_igCmtZh(_lastC),t:'第'+S.schedule.day+'天'});
    }
  });
  /* 本轮是否出现新 NPC 动态 */
  var lastWeek=(S.npc_state._igWeek||0);
  if(wk>lastWeek && dyn.length<28){
    S.npc_state._igWeek=wk;
    var cnt=_ri(1,2,_seedHash('post'+wk));
    for(var j=0;j<cnt;j++){

/* 主角点赞：动态化（路人也会跟着点） */
function igOnLike(i){
  var dyn=(S.npc_state&&S.npc_state._ig)||[];
  var d=dyn[i]; if(!d) return;
  d.liked=!d.liked;
  d.likes=Math.max(0,(d.likes||0)+ (d.liked?1:-1));
  if(d.liked && (d.user!=='我'&&!d.mine)){
    /* 你点赞后，该帖可能会被作者/路人回赞（确定性） */
    var s=_seedHash('like'+i+S.schedule.day);
    if(_rand(s)>0.5){
      d.likes+=_ri(1,14,s>>3);
    }
  }
  /* 别人点赞了你的动态 → 通知 */
  if((d.user==='我'||d.mine) && typeof pushNotif==='function'){
    var frs=igFriends();
    if(frs.length){
      var f=_pick(frs,_seedHash('notify'+i+S.schedule.day)).c;
      pushNotif({app:'ig',title:f.name+' 赞了你的动态',body:(d.text||'').slice(0,24),t:'第'+S.schedule.day+'天'});
    }
  }
  if(typeof saveGame==='function') saveGame();
}
/* 主角评论：追加评论 + 可能收到楼主回复（通知） */
function igOnComment(i,txt){
  if(!txt) return;
  var dyn=(S.npc_state&&S.npc_state._ig)||[];
  var d=dyn[i]; if(!d) return;
  d.comments=Array.isArray(d.comments)?d.comments:[];
  d.comments.push({u:'我',t:txt});
  var isMine=(d.user==='我'||d.mine);
  if(!isMine){
    var s=_seedHash('cm'+i+txt.length+S.schedule.day);
    if(_rand(s)>0.5){
      /* 第三方朋友（非楼主）基于帖子正文回一句有内容的；接不上就不回 */
      var cand=igFriends().filter(function(o){ return (o.c&&o.c.name)!==d.user && (o.c&&o.c.id)!==d.user; });
      var who=(cand.length? _pick(cand,s>>3).c.name : '');
      var rline=who? _igCmt(_igReplyTo(d.text||d.content||'', d.circle||'', who, s), who) : null;
      if(who && rline){
        d.comments.push(rline);
        if(typeof pushNotif==='function'){
          pushNotif({app:'ig',title:who+' 回复了你的评论',body:_igCmtZh(rline),t:'第'+S.schedule.day+'天'});
        }
      }
    }
  }else{
    /* 主角自己的动态被评论：实名朋友 + 基于正文的有内容回应 */
    var frs=igFriends();
    if(frs.length){
      var f=_pick(frs,_seedHash('myc'+i+S.schedule.day)).c;
      var line=_igCmt(_igReplyTo(d.text||d.content||'', d.circle||'', f.name, _seedHash('myl'+i+S.schedule.day)), f.name);
      if(line){
        d.comments.push(line);
        if(typeof pushNotif==='function'){
          pushNotif({app:'ig',title:f.name+' 评论了你的动态',body:_igCmtZh(line),t:'第'+S.schedule.day+'天'});
        }
      }
    }
  }
  if(typeof saveGame==='function') saveGame();
}

/* 按周取当前/临近的节日（供外部调用） */
function calAt(week){
  var out=[];
  for(var i=0;i<CAL_EVENTS.length;i++){
    var e=CAL_EVENTS[i]; if(e.w===week) out.push(e);
  }
  return out;
}

/* —— 节日圈层 → 当周「主场圈层」——
   有节日的周：该节日的主导圈层 c 即为本周主场（如 Spirit Week=社交圈、Super Bowl=体育圈）。
   无节日的周：给出该季度较活跃的默认圈层（不硬套节日）。 */
function activeCircles(week){
  var out=[];
  var ns=calAt(week||1);
  for(var i=0;i<ns.length;i++){ if(ns[i].c && out.indexOf(ns[i].c)<0) out.push(ns[i].c); }
  if(out.length) return {now:out, fest:true};
  /* 平常周的默认主场（按季节微调） */
  var sc=seasonOf(week||1);
  var def = sc.k==='winter' ? ['体育圈','社交圈']
          : sc.k==='summer' ? ['南部圈','社交圈']
          : sc.k==='spring' ? ['体育圈','艺术圈']
          : ['学术圈','社交圈'];
  return {now:def, fest:false};
}

function bindStatus(){
  var up=$('#pfUp'), f=$('#pfFile');
  if(up&&f){
    up.onclick=function(){ f.click(); };
    f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var cv=document.createElement('canvas'); cv.width=200; cv.height=200;
          var ctx=cv.getContext('2d');
          var s=Math.min(img.width,img.height);
          var sx=(img.width-s)/2, sy=(img.height-s)/2;
          ctx.drawImage(img,sx,sy,s,s,0,0,200,200);
          S.player.avatar=cv.toDataURL('image/jpeg',0.82);
          saveGame();
          go('status');
          toast('头像已更新');

        img.src=fr.result;
      };
      fr.readAsDataURL(file);

/* ---------------- 认识的人 ---------------- */
function renderPeople(){
  var h='';
  /* 只显示“已结识”的人：以 meet_log 为准（剧情里真正遇见过）。
     初始好感只是“潜在关系值”，不触发“已结识”。 */
  var met=(S.meet_log||{});
  var list=CHARS.filter(function(c){
    var arr=met[c.id];
    return !!(arr && arr.length);
  });
  /* 最近结识的排前面 */
  list.sort(function(a,b){
    var la=(met[a.id]&&met[a.id].length)? (met[a.id][met[a.id].length-1].d||'') : '';
    var lb=(met[b.id]&&met[b.id].length)? (met[b.id][met[b.id].length-1].d||'') : '';
    return lb.localeCompare(la);
  });
  h+='<div class="card-h">认识的人 <span class="dim">· '+list.length+' 人</span></div>';
  if(!list.length){
    h+='<div class="empty">你还没有认识任何人。<br><span class="dim">去校园里走走，故事里遇到的人会出现在这里。</span></div>';
  }else{
    h+='<div class="people">';
    list.forEach(function(c){
      var v=(S.relationships&&S.relationships[c.id]!=null)? S.relationships[c.id] : 0;
      var band=favBand(v);
      h+='<div class="person c-'+ckey(c.circle)+'" data-person="'+c.id+'">'
        +'<div class="p-av c-'+ckey(c.circle)+'"><span class="p-avt">'+esc(avText(c))+'</span><span class="p-ave">'+circleEmoji(c)+'</span></div>'
        +'<div class="p-info"><div class="p-n">'+esc(cnName(c))+'</div>'
        +'<div class="p-r"><span class="p-ce">'+circleEmoji(c)+'</span> '+esc(c.circle)+' <i class="p-dot">·</i> <span class="p-re">'+roleEmoji(c)+'</span> '+esc(c.role)+'</div>'
        +'<div class="p-b"><span class="band '+band[1]+'">'+band[0]+'</span>'
        +'<div class="bar mini"><div class="bar-f" style="width:'+Math.max(0,Math.min(100,v))+'%"></div></div>'
        +'<span class="p-v">'+v+'</span></div>'
        +'</div><div class="p-go">›</div></div>';
    });
    h+='</div>';
  }
  return h;
}

/* 人物详情页：亲密度 / 认识过程 / 社交标签 */
function renderPerson(){
  var c=CHARS.find(function(x){ return x.id===CUR_PERSON; });
  if(!c) return '<div class="empty">找不到这个人。</div>';
  var v=(S.relationships&&S.relationships[c.id]!=null)? S.relationships[c.id] : 0;
  var band=favBand(v);
  var logs=(S.meet_log&&S.meet_log[c.id])||[];
  var h='<div class="pd-top c-'+ckey(c.circle)+'">'
    +'<div class="pd-av c-'+ckey(c.circle)+'">'+esc(avText(c))+'</div>'
    +'<div class="pd-name">'+esc(cnName(c))+'</div>'
    +'<div class="pd-sub">'+esc(c.circle)+'</div></div>';
  h+='<div class="pd-row"><span class="pd-k">年级</span><span class="pd-v2">'+esc(c.grade||'—')+'</span></div>';
  if(showSex()) h+='<div class="pd-row"><span class="pd-k">性别</span><span class="pd-v2">'+esc(c.gender||'—')+'</span></div>';
  h+='<div class="pd-row"><span class="pd-k">身份</span><span class="pd-v2">'+esc(c.role||'—')+'</span></div>';
  h+='<div class="pd-row"><span class="pd-k">家庭</span><span class="pd-v2">'+esc(c.family||'—')+'</span></div>';
  h+='<div class="card-h">亲密度</div>';
  h+='<div class="pd-fav"><span class="band '+band[1]+'">'+band[0]+'</span>'
    +'<div class="bar"><div class="bar-f" style="width:'+Math.max(0,Math.min(100,v))+'%"></div></div>'
    +'<span class="p-v">'+v+'</span></div>';
  /* 社交标签 */
  var tags=[];
  if(c.circle) tags.push(c.circle);
  if(c.ocean_grade) tags.push('海王包容度 '+c.ocean_grade);
  if(c.appear) tags.push(c.appear);
  if(tags.length){
    h+='<div class="card-h">社交标签</div><div class="pd-tags">';
    tags.forEach(function(x){ h+='<span class="pd-tag c-'+ckey(c.circle)+'">'+esc(x)+'</span>'; });
    h+='</div>';
  }
  if(c.persona){
    h+='<div class="card-h">人物简介</div><div class="pd-txt">'+esc(c.persona)+'</div>';
  }

  h+='<div class="pd-acts">'
    +'<button class="pd-act-btn" id="pdTalk" data-cid="'+c.id+'">🗣 面对面搭话</button>'
    +'</div>';

  h+='<div class="card-h">认识过程</div>';
  if(!logs.length){
    h+='<div class="empty dim">还没有记录。</div>';
  }else{
    h+='<div class="pd-log">';
    logs.slice(-12).forEach(function(x){
      var txt=(typeof x==='string')? x : (x.text||'');
      var wk=(typeof x==='object'&&x.wk)? x.wk : '';
      h+='<div class="pd-li"><span class="pd-wk">'+esc(wk)+'</span>'+esc(txt)+'</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ---------- 页面切换 ---------- */
let TAB='home';
function go(k){
  TAB=k;
  var app=$('#app'); if(!app) return;
  if(typeof closeApp==='function') closeApp();
  if(document.body) document.body.classList[k==='home'?'add':'remove']('home-mode');
  if(k==='home'){
    mountShell();
    redrawFlow();
    renderChoicesForLast();
    renderTop();
    renderNav();
    return;
  }
  if(k==='set')      app.innerHTML=renderSetView();
  else if(k==='setup') app.innerHTML=renderSetupView();
  else if(k==='status'){ app.innerHTML=viewCard('状态', renderStatus(), '<span class="dim">常驻</span>'); setTimeout(bindStatus,0); }
  else if(k==='people') app.innerHTML=viewCard('认识的人', renderPeople());
  else if(k==='person') app.innerHTML=viewCard('人物详情', renderPerson());
  if(k==='person'){ setTimeout(function(){ var tb=$('#pdTalk'); if(tb) tb.onclick=function(){ openApp('face:'+tb.dataset.cid); }; },0); }
  else if(k==='save')   app.innerHTML=viewCard('存档 / 设置', renderSave());
  else if(k==='phone')  app.innerHTML=renderPhoneView();
  else if(k==='prefs')  app.innerHTML=renderPrefsView();
  else if(k==='help')   app.innerHTML=renderHelpView();

  /* 人物列表 -> 详情页 */
  $$('[data-person]').forEach(function(el){
    el.onclick=function(){ CUR_PERSON=el.dataset.person; CUR_TAB_FROM='people'; go('person'); };
  });
  if(k==='phone'){
    $$('.p-app').forEach(function(el){
      el.onclick=function(){
        var k2=el.dataset.app;
        openApp(k2);
      };
    });
    $$('.ph-bell').forEach(function(el){
      el.onclick=function(){ openApp('notif'); };
    });
    if(typeof renderBadges==='function') renderBadges();
  }
  if(k==='save') bindSave();
  if(k==='set')  bindSet();
  if(k==='prefs') bindPrefs();
  if(k==='setup') bindSetup();
  renderNav();
  renderTop();
  window.scrollTo(0,0);
}

/* ---------- 主页重绘（从存档回填剧本流） ---------- */
function redrawFlow(){
  var flow=$('#flow'); if(!flow) return;
  flow.innerHTML='';
  var rec=(S&&S.gm_memory&&S.gm_memory.scene_log)||[];
  if(!rec.length){
    var d=document.createElement('div'); d.className='turn';
    d.innerHTML='<div class="narr dim">还没有开始。<br>点下方「开始游戏」推进第一幕，或在输入框直接写下你要做的事。</div>';
    flow.appendChild(d);
  }else{
    rec.forEach(function(sc){ appendScene(sc); });
  }
  if(LAST_SCENE&&LAST_SCENE.hook) showHook(LAST_SCENE.hook);
}
function renderChoicesForLast(){
  /* 固定开场期间，行动框由 INTRO 独占 */
  if(typeof INTRO!=='undefined' && INTRO.active && INTRO.active()){ INTRO.show(); return; }
  if(LAST_SCENE&&LAST_SCENE.options&&LAST_SCENE.options.length) showOptions(LAST_SCENE);
  else{
    var box=$('#choices'); if(!box) return;
    box.innerHTML='<div class="free-row"><input id="freeIn" class="free-in" placeholder="写下你想做的事/想说的话…"><button id="freeGo" class="free-go">发送</button></div>';
    box.classList.add('on');
    var fin=$('#freeIn');
    if(fin) fin.onkeydown=function(e){ if(e.key==='Enter'){ var v=fin.value.trim(); if(v) sendAction(v); } };
    var fg=$('#freeGo');
    if(fg) fg.onclick=function(){ var bi=$('#freeIn'); var v=bi?bi.value.trim():''; if(v){ bi.value=''; sendAction(v); } };
  }
}

/* ---------- 首次进入的开场按钮 ---------- */
function renderStartBtn(){
  /* 固定开场：不再让 AI 自由生成第一幕，改为脚本化的引导序列 */
  INTRO.show();
}
/* ============================================================
   固定开场（INTRO）：校门口 → 唯一行动「打开手机看 IG」
   → 看到 Luna 动态 → 私信 Luna → 成为第一个朋友。
   第四批需求：第一天只做新生报道与认识学校/Luna，圈子报名后置。
   ============================================================ */
var INTRO={
  /* 渲染一条旁白（复用 narr-box/narr-seg 样式） */
  seg:function(tag,txt,color){
    /* tag/color 仅保留入参，不再渲染文字标签 */
    var flow=$('#flow'); if(!flow) return;
    var d=document.createElement('div'); d.className='turn';
    d.innerHTML='<div class="narr-box"><div class="narr-seg">'+esc(txt)+'</div></div>';
    flow.appendChild(d); flowScroll();
  },
  /* 渲染玩家自己的动作/台词 */
  mine:function(txt){
    var flow=$('#flow'); if(!flow) return;
    var d=document.createElement('div'); d.className='turn';
    d.innerHTML='<div class="mine" data-mine="1">'+esc(txt)+'</div>';
    flow.appendChild(d); flowScroll();
    try{ bindEditable(); }catch(e){}
  },
  /* 渲染一条 NPC 气泡 */
  bub:function(id,txt){
    var c=charById(id);
    var flow=$('#flow'); if(!flow) return;
    var d=document.createElement('div'); d.className='turn';
    d.innerHTML=bubble(c?c.name:id, c?c.circle:'', txt);
    flow.appendChild(d); flowScroll();
  },
  /* 只给一个唯一选项的行动框 */
  sole:function(text,hint,color,fn){
    /* 兼容 3 参调用（text,hint,fn）：若第3参不是函数，则视为颜色 */
    if(typeof color==='function'){ fn=color; color=null; }
    var box=$('#choices'); if(!box) return;
    box.innerHTML='<button class="btn-main" id="introSole"'+(color?(' style="border-color:'+color+'"'):'')+'><span class="opt-t">'+esc(text)+'</span><span class="opt-h">'+esc(hint||'')+'</span></button>';
    box.classList.add('on');
    var b=$('#introSole'); if(b) b.onclick=fn;
  },
  step:function(){
    if(!S) return 0;
    return (S.flags&&S.flags.introStep)||0;
  },
  setStep:function(n){ if(!S) return; S.flags=S.flags||{}; S.flags.introStep=n; try{saveGame();}catch(e){} },
  done:function(){ if(!S) return; S.flags=S.flags||{}; S.flags.introDone=true; try{saveGame();}catch(e){} },
  isDone:function(){ return !!(S&&S.flags&&S.flags.introDone); },
  /* 当前处于固定开场？ */
  active:function(){ return S && !INTRO.isDone() && INTRO.step()<4; },
  /* 开局渲染：根据当前 step 回填画面 */
  show:function(){
    var st=INTRO.step();
    if(st===0){ INTRO.s0(); }
    else if(st===1){ INTRO.goto1(); }
    else if(st===2){ INTRO.goto2(); }
    else if(st===3){ INTRO.goto3(); }
    else { INTRO.done(); renderChoicesForLast(); }
  },
  /* step0：校门口，唯一行动 = 打开手机看 IG */
  s0:function(){
    INTRO.seg('场景','开学第一天。Northgate High 的校门敞着，铁栅栏上挂着褪色的横幅 —— Homecoming 的旧标语还没摘。背着书包的新生三三两两往里走，北边停车场方向传来一阵引擎声，南边草坪上有人在拍球。空气里有加州九月干燥的草味。','#8A8178');
    INTRO.seg('气氛','1800 人的学校，没有人认识我。铃声还有十几分钟才响。','#E67E22');
    INTRO.setStep(1);
    INTRO.sole('打开手机，看看 IG','新生嘛，先刷会儿手机','#8A8178',function(){
      INTRO.mine('（我掏出手机，点开 IG。）');
      INTRO.goto1();
    });
  },
  /* step1：打开 IG —— 首次进入，注入 Luna 的迎新动态 */
  goto1:function(){
    INTRO.setStep(2);
    try{ INTRO.seedLunaPost(); }catch(e){}
    INTRO.seg('动向','屏幕亮起来。首页刷出几条新动态，最上面那条，是一个叫 Luna 的人发的。','#2E86C1');
    INTRO.sole('看看 Luna 的动态','她好像也在找同伴','#2E86C1',function(){
      INTRO.goto2();
    });
  },
  /* step2：展示 Luna 动态内容 → 引导私信 */
  goto2:function(){
    INTRO.setStep(3);
    INTRO.bub('luna','有新来的一起吗😀');
    INTRO.seg('余韵','配图是一张琴房窗外的照片，玻璃上蒙着一层雾。她的账号没什么粉丝，动态也很少，但这一条像是专门留给今天发的。','#8E44AD');
    INTRO.sole('给 Luna 发条私信，问她要不要一起走','陌生人，但可以先打个招呼','#8E44AD',function(){
      INTRO.goto3();
    });
  },
  /* step3：私信 Luna → Luna 回应 → 同行，成为第一个朋友 */
  goto3:function(){
    INTRO.setStep(4);
    INTRO.mine('（我点开她的头像，发了一条私信：）嗨，我也是新来的。一起走吗？');
    INTRO.seg('场景','发完之后我把手机塞回口袋，站在校门口等。过了一分钟，手机震了一下。','#8A8178');
    INTRO.bub('luna','……哦。你在门口？别动，我过来。');
    INTRO.bub('luna','我穿黑卫衣，背个吉他包。认不出来也没事，反正这儿也没几个人我认识。');
    INTRO.seg('余韵','几分钟后，一个黑卫衣、银灰挑染的女生从教学楼侧门绕出来，径直朝校门口走。她看了我一眼，把吉他包往肩上挪了挪，停下。','#8E44AD');
    INTRO.bub('luna','……走吧。第一节课在哪儿，你知道么？');
    /* 结识 Luna：写入 meet_log + 好感种子 + 私信记录 */
    try{
      S.meet_log=S.meet_log||{};
      S.meet_log.luna=S.meet_log.luna||[];
      if(S.meet_log.luna.indexOf('开学第一天·校门口')<0) S.meet_log.luna.push('开学第一天·校门口');
      S.relationships=S.relationships||{};
      S.relationships.luna=Math.max(S.relationships.luna||0, 8);
      var arr=chatOf('luna');
      arr.push({me:true,t:'嗨，我也是新来的。一起走吗？',time:'第1天 08:2'});
      arr.push({me:false,t:'……哦。你在门口？别动，我过来。',time:'第1天 08:2'});
      arr.push({me:false,t:'我穿黑卫衣，背个吉他包。认不出来也没事，反正这儿也没几个人我认识。',time:'第1天 08:2'});
    }catch(e){}
    INTRO.done();
    /* 交还给 AI：给一个温和的、单线的继续行动 */
    INTRO.sole('和 Luna 一起走进教学楼','第一天，先认认路','#27AE60',function(){
      sendAction('（我和 Luna 一起走进教学楼。开学第一天，先跟着她认识一下学校。）');
    });
  },
  /* 向 IG 池注入 Luna 的迎新动态（幂等） */
  seedLunaPost:function(){
    S.npc_state=S.npc_state||{};
    var dyn=S.npc_state._ig||[];
    S.npc_state._ig=dyn;
    for(var i=0;i<dyn.length;i++){ if(dyn[i]&&dyn[i].user==='Luna Kim') return; }
    dyn.unshift({user:'Luna Kim', text:'any other new kids here? walk in together', likes:12, comments:[], t:'第1天', _luna:true});
    saveGame();
  }
};

/* ---------- 当前地点（需求②）---------- */
function curPlace(){
  try{
    if(S && S.loc) return S.loc;
    if(typeof LAST_SCENE==='object' && LAST_SCENE && LAST_SCENE.place) return LAST_SCENE.place;
    var sc=(S&&S.schedule)||{};
    var d=((sc.day||0)%7);
    if(d>=5) return '家 · 后院泳池';
    var h=(sc.week||1);
    return (h%2===0)? 'Northgate High · 食堂' : 'Northgate High · 教学楼';
  }catch(e){ return 'Northgate High'; }
}
function weatherNow(){
  try{
    var sc=(S&&S.schedule)||{};
    return weatherAt(sc.year||1, sc.week||1, sc.day||0);
  }catch(e){ return {txt:'☀️ Clear 70°F'}; }
}
function renderStatusBar(){
  var el=document.getElementById('statusBar'); if(!el) return;
  if(!S){ el.innerHTML=''; return; }
  var w=weatherNow();
  el.innerHTML='<span class="sb-i">📍 <b>'+esc(curPlace())+'</b></span>'
    +'<span class="sb-sep">·</span>'
    +'<span class="sb-i">🕐 <b>'+esc(timeStr())+'</b></span>'
    +'<span class="sb-sep">·</span>'
    +'<span class="sb-i">'+esc(w.emo||'')+' <b>'+esc(w.t||'')+' '+esc(String(w.temp!=null?w.temp:'')+'°F')+'</b></span>';
}

/* ---------- 顶栏（时间 + 关键数值常驻） ---------- */

/* ---------- 底部导航 ---------- */
function renderNav(){
  var nav=$('#nav'); if(!nav) return;

function bindPersona(){
  var map={psapp:'appearance',psper:'personality',pstal:'talent',psori:'orientation',pssoc:'socialStyle'};
  $$('.chips .chip').forEach(function(c){
    c.onclick=function(){
      var box=c.parentNode; if(!box||!box.dataset) return;
      var key=box.dataset.for;
      var sel={psapp:'#psApp',psper:'#psPer',pstal:'#psTal',psori:'#psOri',pssoc:'#psSoc'}[key];
      if(!sel) return;
      var el=$(sel); if(el) el.value=c.dataset.v;
      $$('.chips[data-for="'+key+'"] .chip').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on');
    };
  });
  Object.keys(map).forEach(function(id){
    var el=$('#'+id); if(!el) return;
    el.oninput=function(){
      $$('.chips[data-for="'+id+'"] .chip').forEach(function(c){ c.classList.toggle('on', c.dataset.v===el.value.trim()); });
    };
  });
  var sv=$('#psSave');
  if(sv) sv.onclick=function(){
    if(!S||!S.player){ toast('还没有存档'); return; }
    var a=$('#psAge'); if(a) S.player.age=parseInt(a.value,10)||S.player.age;
    ['psApp:appearance','psPer:personality','psTal:talent','psOri:orientation','psSoc:socialStyle'].forEach(function(pair){
      var k=pair.split(':'); var el=$('#'+k[0]); if(el) S.player[k[1]]=el.value.trim();
    });
    if(S.player.socialStyle!==undefined) S.player.social_style=S.player.socialStyle;
    saveGame(); toast('人设已更新 ✓'); renderTop();
  };
  var rd=$('#psRand');
  if(rd) rd.onclick=function(){
    if(!S||!S.player){ toast('还没有存档'); return; }
    S.player.age=14+Math.floor(Math.random()*5);
    S.player.appearance=pick(APP_PRESET);
    S.player.personality=pick(PER_PRESET);
    S.player.talent=pick(TAL_PRESET);
    S.player.orientation=pick(ORI_PRESET);
    S.player.socialStyle=pick(SOC_PRESET);
    S.player.social_style=S.player.socialStyle;
    saveGame(); toast('已重掷 ✓ 姓名性别保留'); go('set');
  };
}

function renderSetupView(){
  if(!NEWC) resetNewc();

  var names=['难度','身份','家庭','档案','总览','开始'];
  var h='<div class="setup-steps">';
  for(var i=0;i<6;i++){
    var cls='ss-dot'+(i+1<step?' done':(i+1===step?' on':''));
    h+='<div class="'+cls+'"><i>'+(i+1)+'</i><span>'+names[i]+'</span></div>';
  }

    + '<div class="view-h"><span class="view-t">开局 · 第 '+step+'/6 步</span></div>'
    + h
    + '</div>' + foot + '</div>';

function startNewGame(nc){
  nc=nc||NEWC||{};
  var d=DIFF[nc.difficulty||'N'], id=IDENT[nc.identity||'C'], fam=FAM[(nc.family||3)-1];
  S=newGame(nc.name||'无名','高一',nc.gender||'男');
  S.player.background = fam.t;
  S.player.age = nc.age||16;
  S.player.difficulty = d.key;
  S.player.identity = id.name;
  S.player.appearance = nc.appearance||'';
  S.player.personality = nc.personality||'';
  S.player.talent = nc.talent||'';
  S.player.orientation = nc.orientation||'';
  S.player.socialStyle = nc.socialStyle||'';
  S.resources = S.resources||{};
  S.resources['现金'] = Math.round((d.money*0.4)+(fam.money*0.6));
  S.social = S.social||{};
  S.social['人气值'] = clamp(id.pop + d.fav, 0, 100);
  /* 圈子知名度：身份 + 家庭阶层双重加成（补丁·权力权重） */
  S.social['圈子知名度'] = S.social['圈子知名度']||
    {'体育圈':0,'社交圈':0,'学术圈':0,'艺术圈':0,'南部圈':0,'地下圈':0};
  (function(){
    var cb={}, k;
    var a=(id.circleBonus||{}), b=(fam.circleBonus||{});
    for(k in a){ if(a.hasOwnProperty(k)) cb[k]=(cb[k]||0)+a[k]; }
    for(k in b){ if(b.hasOwnProperty(k)) cb[k]=(cb[k]||0)+b[k]; }
    for(k in cb){
      if(!cb.hasOwnProperty(k)) continue;
      if(S.social['圈子知名度'][k]==null) S.social['圈子知名度'][k]=0;
      S.social['圈子知名度'][k]=clamp(S.social['圈子知名度'][k]+cb[k],0,100);
    }
  })();
  S.flags = S.flags||{};
  S.flags.difficulty=d.key; S.flags.gossipMul=d.gossip; S.flags.followers=id.followers||0;
  S.flags.baseFav=d.fav; S.flags.enemyBoost=d.enemy;
  S.flags.camp = id.camp || fam.camp || '';
  S.flags.power = id.power || '普通学生';
  S.flags.identKey = id.key;
  /* 结识记录：人物列表的真相源 */
  S.meet_log = S.meet_log || {};
  S.npc_state = S.npc_state || {};
  (function(){
    /* 同圈子/同阵营的风云人物，开学第一天只是“听说过你” ——
       ⚠ 只给好感种子(charFav)，不再写入 meet_log，
       否则一开局「认识的人」就会整屏都是名字，违背“刚到校谁都不认识”。 */
    var camp = S.flags.camp;
    CHARS.forEach(function(c){
      var sameCamp = camp && c.camp && c.camp===camp;
      var sameCir  = id.circle && c.circle===id.circle;
      var hiPower  = (id.power==='Varsity校队'||id.power==='社交圈');
      if(sameCamp || sameCir){
        S.relationships[c.id] = clamp((S.relationships[c.id]||0) + (sameCamp?4:3), -100, 100);
        /* 好感种子写进 npc_state，但不进 meet_log */
        S.npc_state[c.id] = S.npc_state[c.id] || {};
        S.npc_state[c.id].charFav = true;
      } else if(hiPower && c.circle===id.circle){
        S.relationships[c.id] = clamp((S.relationships[c.id]||0) + 2, -100, 100);
      }
    });
  })();
  if(!S.meet_log) S.meet_log = {};
  /* 开局种子素材：让论坛/IG 在第一天就有内容（世界先于主角运转） */
  S.npc_state = S.npc_state || {};
  S.npc_state._forum = [

    {author:'匿名 · 高三', text:'有人知道食堂三楼到底是谁的地盘吗，我就是想吃个饭。', likes:73, replies:[]}

  S.npc_state._ig = [

/* ---- 事件绑定（选中即前进） ---- */
function bindSetup(){
  var scroll=$('.setup-scroll');
  if(scroll) scroll.scrollTop=0;

  /* 第1~3步：卡片单选 → 记录 + 短暂高亮 → 自动进入下一步 */
  $$('.bg-item').forEach(function(el){
    el.onclick=function(){
      if(el.dataset.diff){ NEWC.difficulty=el.dataset.diff; $$('.bg-item').forEach(function(x){x.classList.remove('on')}); el.classList.add('on'); }
      else if(el.dataset.id){ NEWC.identity=el.dataset.id; $$('.bg-item').forEach(function(x){x.classList.remove('on')}); el.classList.add('on'); }
      else if(el.dataset.fam){ NEWC.family=parseInt(el.dataset.fam,10); $$('.bg-item').forEach(function(x){x.classList.remove('on')}); el.classList.add('on'); }
      else return;
      autoNext();
    };
  });

  /* 性别：只记录，不自动跳（同页还有其他字段） */
  $$('#ncGender .seg-b').forEach(function(b){
    b.onclick=function(){ $$('#ncGender .seg-b').forEach(function(x){x.classList.remove('on')}); b.classList.add('on'); NEWC.gender=b.dataset.g; };
  });

  
  /* 第4步：预设 chips —— 点一下填进对应输入框 */
  function fillField(key,val){
    var m={name:'#ncName',age:'#ncAge',app:'#ncApp',per:'#ncPer',tal:'#ncTal',ori:'#ncOri',soc:'#ncSoc'};
    var sel=m[key]; if(!sel) return;
    var el=$(sel); if(!el) return;
    el.value=val;
    var box=document.querySelector('.chips[data-for="'+key+'"]');
    if(box) $$('.chips[data-for="'+key+'"] .chip').forEach(function(c){
      c.classList.toggle('on', c.dataset.v===val);
    });
  }
  $$('.chips .chip').forEach(function(c){
    c.onclick=function(){
      if(c.dataset.v==='__RAND__'){ fillField('name',randName()); return; }
      var box=c.parentNode; var key=box?box.dataset.for:'';
      fillField(key,c.dataset.v);
      if(key==='gender'){ NEWC.gender=c.dataset.v; }
    };
  });

  /* 输入框手输时，同步取消/点亮 chip */
  var F={ncName:'name',ncAge:'age',ncApp:'app',ncPer:'per',ncTal:'tal',ncOri:'ori',ncSoc:'soc'};
  Object.keys(F).forEach(function(id){
    var el=$('#'+id); if(!el) return;
    el.oninput=function(){
      var key=F[id];
      $$('.chips[data-for="'+key+'"] .chip').forEach(function(c){
        if(c.dataset.v!=='__RAND__') c.classList.toggle('on', c.dataset.v===el.value.trim());
      });
    };
  });

  /* 全部随机 */
  var ra=$('#sRandAll');
  if(ra) ra.onclick=function(){ randomizeAll(); };

/* 底部按钮 */
  var bk=$('#sBack');
  if(bk) bk.onclick=function(){ NEWC.step=Math.max(1,(NEWC.step||1)-1); go('setup'); };

  var nx=$('#sNext');
  if(nx) nx.onclick=function(){
    if((NEWC.step||1)===4) collectProfile();
    NEWC.step=Math.min(5,(NEWC.step||1)+1); go('setup');
  };
  var st=$('#sStart');
  if(st) st.onclick=function(){ collectProfile(); startNewGame(NEWC); };
}

/* 选中后自动前进（带一点点延迟，让高亮可见） */
var _ngGoT=null;
function autoNext(){
  if(_ngGoT) clearTimeout(_ngGoT);
  _ngGoT=setTimeout(function(){
    _ngGoT=null;
    NEWC.step=Math.min(5,(NEWC.step||1)+1);
    go('setup');
  },220);
}

/* 收集第4步表单（自动前进/下一步/进入校园 都会先落盘） */
function collectProfile(){
  var el;
  el=$('#ncName'); if(el && el.value.trim()) NEWC.name=el.value.trim();
  el=$('#ncAge');  if(el) NEWC.age=parseInt(el.value,10)||16;
  el=$('#ncApp');  if(el) NEWC.appearance=el.value.trim();
  el=$('#ncPer');  if(el) NEWC.personality=el.value.trim();
  el=$('#ncTal');  if(el) NEWC.talent=el.value.trim();
  el=$('#ncOri');  if(el) NEWC.orientation=el.value.trim();
  el=$('#ncSoc');  if(el) NEWC.socialStyle=el.value.trim();
}


/* ---------- 随机 ---------- */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function randName(){ return pick(NAME_SUR)+pick(NAME_GIV); }
function randomizeAll(){
  if(!NEWC) resetNewc();
  NEWC.name=randName();
  NEWC.age=14+Math.floor(Math.random()*5);
  NEWC.appearance=pick(APP_PRESET);
  NEWC.personality=pick(PER_PRESET);
  NEWC.talent=pick(TAL_CN);
  NEWC.orientation=pick(ORI_PRESET);
  NEWC.socialStyle=pick(SOC_PRESET);
  NEWC.gender=pick(GENDER_PRESET);
  var gym=Math.random()<0.5;
  NEWC.difficulty=pick(['E','N','H','NI']);
  NEWC.identity=pick(['A','B','C','D','E','F'].filter(function(k){return IDENT[k];}));
  NEWC.family=1+Math.floor(Math.random()*FAM.length);
  go('setup');
}

/* ---------- 启动 ---------- */
function boot(){
  loadCfg();
  applySkin(SKIN); applyPref();
  var loaded=loadGame();
  mountShell();
  renderNav();
  if(loaded){
    LAST_SCENE=(S.gm_memory&&S.gm_memory.scene_log&&S.gm_memory.scene_log.length)
      ? S.gm_memory.scene_log[S.gm_memory.scene_log.length-1] : null;
    go('home');
    if(!LAST_SCENE) renderStartBtn();
    if(!hasKey()){ bootGate(); }
  }else{
    if(!hasKey()){ bootGate(); }
    else{ resetNewc(); NEWC.step=1; go('setup'); }
  }
  renderTop();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();


</script>
</body>
</html>
